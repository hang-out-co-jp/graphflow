<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphFlow — 業務フロー設計盤</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231B1E21'/><path d='M3 8h3M10 5h3M10 11h3M6 8l4-3M6 8l4 3' stroke='%23F1F2F4' stroke-width='1.2' fill='none'/><circle cx='13.4' cy='3' r='2' fill='%23D0342C'/></svg>">
<style>
:root{
  --ground:#F1F2F4; --panel:#E7E9EC; --sunk:#DCDFE3;
  --ink:#1B1E21; --ink-2:#5A6167; --ink-3:#878E95;
  --line:#A9AFB5; --line-2:#C7CCD1;
  --shu:#D0342C; --shu-soft:#F6DDDA;
  --ai:#17456B; --ai-soft:#D9E4EE;
  --ok:#2F6B4F;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#15181A; --panel:#1E2225; --sunk:#101315;
    --ink:#E3E7EA; --ink-2:#9BA3AA; --ink-3:#6E777E;
    --line:#464E54; --line-2:#333A3F;
    --shu:#FF6B57; --shu-soft:#3A211D;
    --ai:#7FB2DE; --ai-soft:#1B2A38;
    --ok:#6FBF97;
  }
}
:root[data-theme="light"]{
  --ground:#F1F2F4; --panel:#E7E9EC; --sunk:#DCDFE3;
  --ink:#1B1E21; --ink-2:#5A6167; --ink-3:#878E95;
  --line:#A9AFB5; --line-2:#C7CCD1;
  --shu:#D0342C; --shu-soft:#F6DDDA;
  --ai:#17456B; --ai-soft:#D9E4EE; --ok:#2F6B4F;
}
:root[data-theme="dark"]{
  --ground:#15181A; --panel:#1E2225; --sunk:#101315;
  --ink:#E3E7EA; --ink-2:#9BA3AA; --ink-3:#6E777E;
  --line:#464E54; --line-2:#333A3F;
  --shu:#FF6B57; --shu-soft:#3A211D;
  --ai:#7FB2DE; --ai-soft:#1B2A38; --ok:#6FBF97;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

/* ── 表題欄まわりで繰り返す製図ラベル ───────────────── */
.stencil{
  font-family:var(--mono); font-size:10px; font-weight:500;
  letter-spacing:.26em; text-transform:uppercase; color:var(--ink-3);
}

.app{display:flex;flex-direction:column;height:100dvh;min-height:0}

/* ── 図枠ヘッダ ───────────────────────────────── */
header{
  display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;
  padding:11px 18px;border-bottom:1px solid var(--line);
  background:var(--panel);
}
.wordmark{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.3em;text-transform:uppercase}
.wordmark span{color:var(--shu)}
.hd-field{display:flex;align-items:baseline;gap:8px;min-width:0}
.hd-field>.stencil{white-space:nowrap;flex:none}
.hd-field input{
  background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:1px 3px;font-family:var(--mono);font-size:13px;min-width:9ch;
}
.hd-field input:invalid{border-bottom-color:var(--shu);color:var(--shu)}
.hd-spacer{margin-left:auto}
.ghost{
  background:transparent;border:1px solid var(--line);color:var(--ink-2);
  padding:4px 11px;cursor:pointer;font-family:var(--mono);font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;
}
.ghost:hover{border-color:var(--ink-2);color:var(--ink)}

/* ── 3欄 ─────────────────────────────────────── */
main{flex:1;display:grid;grid-template-columns:190px minmax(0,1fr) 326px;min-height:0}
.col{min-height:0;overflow-y:auto;overflow-x:hidden}
.col.left{border-right:1px solid var(--line);background:var(--panel)}
.col.right{border-left:1px solid var(--line);background:var(--panel)}
.pad{padding:14px}
.sect+.sect{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line-2)}
.sect>.stencil{display:block;margin-bottom:9px}

/* ── 部品箱 ───────────────────────────────────── */
.part{
  display:block;width:100%;text-align:left;cursor:pointer;margin-bottom:5px;
  padding:7px 10px;background:var(--ground);border:1px solid var(--line-2);
}
.part:hover{border-color:var(--ai);}
.part b{display:block;font-size:13px;font-weight:600}
.part i{display:block;font-style:normal;font-size:11px;color:var(--ink-3);line-height:1.45}
.part[data-k="gate"]{border-left:3px solid var(--ai)}

/* ── 図面（キャンバス）───────────────────────────── */
.canvas-wrap{position:relative;overflow:auto;height:100%;background:var(--sunk)}
.canvas-inner{position:relative;padding:26px;min-width:100%;width:max-content}
svg.wire{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.wire path{fill:none;stroke:var(--ink-3);stroke-width:1.6}
svg.wire path.check{stroke-dasharray:4 3;stroke:var(--line)}
svg.wire polygon{fill:var(--ink-3)}
svg.wire polygon.check{fill:var(--line)}
.grid-note{
  position:sticky;top:0;left:0;z-index:3;display:flex;gap:16px;align-items:center;
  padding:7px 26px;background:var(--sunk);border-bottom:1px solid var(--line-2);
}
.grid-note .legend{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.grid-note .legend b{color:var(--ink-2);font-weight:600}
.grid-note #scale-note{margin-left:auto;white-space:nowrap}
.seg-band{
  position:relative;margin:0 0 4px;padding:5px 0 3px;
  border-top:1px solid var(--line-2);
}
.seg-band:first-child{border-top:0}
.seg-band .stencil{color:var(--ai)}

.rank-row{position:relative;display:flex;gap:28px;align-items:flex-start;padding:8px 0}
.rank-col{display:flex;flex-direction:column;gap:12px}

/* 繰り返しの帯。図面の上に「ここは何周も回る」と書いておく場所 */
.loop-band{
  position:relative;border:1px dashed var(--ai);padding:22px 14px 12px;
  background:color-mix(in srgb,var(--ai) 5%,transparent);
}
.loop-cap{
  position:absolute;top:-1px;left:-1px;display:flex;align-items:baseline;gap:10px;
  padding:2px 9px;background:var(--ai);color:#fff;flex-wrap:wrap;max-width:calc(100% + 2px);
}
.loop-cap .stencil{color:#fff}
.loop-cap.bad{background:var(--shu)}
.loop-cond,.loop-judge{font-size:10.5px;white-space:nowrap}
.loop-judge{opacity:.85}
.loop-cols{display:flex;gap:28px;align-items:flex-start}
/* 段の見出し。「同時に走る」を伝えるのはここだけ */
.rank-head{
  display:flex;align-items:baseline;gap:7px;min-height:17px;
  padding-bottom:3px;border-bottom:1px solid var(--line-2);
}
.rank-head .n{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink-3)}
.rank-head .sim{
  font-size:10px;font-weight:600;color:var(--ai);
  border:1px solid var(--ai);padding:0 5px;white-space:nowrap;
}
.rank-add{
  margin-left:auto;flex:none;padding:0 6px;line-height:15px;
  background:transparent;border:1px dashed var(--line);color:var(--ink-3);
  cursor:pointer;font-size:10px;white-space:nowrap;opacity:.5;transition:opacity .12s;
}
.rank-col:hover .rank-add,.rank-add:focus-visible{opacity:1}
.rank-add:hover{border-color:var(--ai);border-style:solid;color:var(--ai);opacity:1}
@media (prefers-reduced-motion:reduce){.rank-add{transition:none}}

.node{
  position:relative;width:172px;background:var(--ground);
  border:1px solid var(--line);cursor:pointer;text-align:left;padding:0;
  display:block;
}
/* 選んだ部品にだけ出る、外すボタン */
.node-x{
  flex:none;width:18px;height:18px;line-height:1;padding:0;
  background:transparent;border:1px solid var(--line-2);color:var(--ink-3);
  cursor:pointer;font-family:var(--mono);font-size:12px;
}
.node-x:hover{border-color:var(--shu);color:var(--shu);background:var(--shu-soft)}
.node:hover{border-color:var(--ink-2)}
.node.sel{border-color:var(--ai);box-shadow:0 0 0 2px var(--ai-soft)}
.node.bad{border-color:var(--shu)}
.node-top{
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  padding:3px 8px;border-bottom:1px solid var(--line-2);background:var(--panel);
}
.node-body{padding:7px 9px 9px}
.node-title{font-size:12.5px;font-weight:600;line-height:1.4;word-break:break-word}
.node-meta{margin-top:5px;font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.04em}
.node[data-k="gate"]{border-style:double;border-width:3px;border-color:var(--ai);width:172px}
.node[data-k="gate"] .node-top{background:var(--ai-soft)}
.node[data-k="verify"] .node-top{background:var(--shu-soft)}

/* 朱記 = 指摘マーク。図面上で赤いのは指摘だけ */
.shu-mark{
  position:absolute;top:-9px;right:-9px;z-index:2;
  min-width:19px;height:19px;padding:0 5px;border-radius:50%;
  background:var(--shu);color:#fff;
  font-family:var(--mono);font-size:11px;font-weight:700;line-height:19px;text-align:center;
}
.empty-canvas{color:var(--ink-3);font-size:13px;max-width:46ch;padding:34px 6px}
.empty-canvas code{font-family:var(--mono);font-size:12px;color:var(--ink-2)}

/* ── 右欄フォーム ─────────────────────────────── */
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;margin-bottom:3px}
.in,textarea.in,select.in{
  width:100%;background:var(--ground);border:1px solid var(--line-2);
  padding:5px 7px;font-family:var(--mono);font-size:12px;
}
textarea.in{resize:vertical;min-height:56px;line-height:1.6}
.in:focus{border-color:var(--ai)}
.row{display:flex;gap:6px}
.row .in{min-width:0}
.chk{display:flex;gap:7px;align-items:flex-start;margin-bottom:8px;cursor:pointer}
.chk input{margin:3px 0 0;flex:none}
.chk span{font-size:12.5px;line-height:1.5}
.chk small{display:block;color:var(--ink-3);font-size:11px;line-height:1.45}
.pair{display:grid;grid-template-columns:1fr 92px 26px;gap:5px;margin-bottom:5px}
.mini{
  background:transparent;border:1px solid var(--line-2);color:var(--ink-3);
  cursor:pointer;font-family:var(--mono);font-size:12px;padding:0;
}
.mini:hover{border-color:var(--shu);color:var(--shu)}
.add{
  background:transparent;border:1px dashed var(--line);color:var(--ink-2);
  cursor:pointer;padding:4px 9px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
}
.add:hover{border-color:var(--ai);color:var(--ai)}
#inspector>.add{display:block;width:100%;margin-top:8px;text-align:center}
#inspector>.add.pick{text-align:left;padding:5px 9px}
.danger{border-color:var(--shu);color:var(--shu)}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin:-4px 0 11px}
.deps{display:flex;flex-wrap:wrap;gap:5px}
.dep{
  font-family:var(--mono);font-size:11px;padding:2px 7px;cursor:pointer;
  border:1px solid var(--line-2);background:var(--ground);color:var(--ink-3);
}
.dep.on{border-color:var(--ai);background:var(--ai-soft);color:var(--ink)}

/* ── 表題欄（署名要素）─────────────────────────── */
.titleblock{
  display:grid;grid-template-columns:repeat(4,minmax(76px,auto)) 1fr auto;
  align-items:stretch;border-top:1px solid var(--line);background:var(--panel);
}
.tb{padding:7px 14px;border-right:1px solid var(--line-2);min-width:0}
.tb .stencil{display:block}
.tb b{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.02em}
.tb.flag b{color:var(--shu)}
.tb.pass b{color:var(--ok)}
.tb-list{overflow-y:auto;max-height:74px;padding:6px 14px;border-right:1px solid var(--line-2)}
.finding{
  display:flex;gap:8px;align-items:baseline;font-size:11.5px;line-height:1.5;
  padding:1px 0;cursor:pointer;background:none;border:0;text-align:left;width:100%;
}
.finding code{font-family:var(--mono);font-size:10px;color:var(--shu);flex:none;letter-spacing:.06em}
.finding.warn code{color:var(--ink-3)}
.finding:hover span{text-decoration:underline}
.tb-actions{display:flex;align-items:center;gap:8px;padding:8px 14px}
.issue{
  background:var(--ink);color:var(--ground);border:1px solid var(--ink);
  padding:8px 20px;cursor:pointer;font-family:var(--mono);font-size:12px;
  font-weight:600;letter-spacing:.22em;text-transform:uppercase;
}
.issue[disabled]{
  background:transparent;color:var(--ink-3);border-color:var(--line);
  cursor:not-allowed;letter-spacing:.22em;
}
.issue:not([disabled]):hover{background:var(--ai);border-color:var(--ai);color:#fff}
@media (prefers-reduced-motion:no-preference){
  .issue:not([disabled]){animation:ready .45s ease-out}
  @keyframes ready{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
}

/* ── 書き出しダイアログ ───────────────────────────── */
dialog{
  border:1px solid var(--line);background:var(--ground);color:var(--ink);
  padding:0;width:min(920px,94vw);max-height:88dvh;
}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-hd{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.dlg-hd .stencil{flex:1}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tab{
  background:transparent;border:0;border-bottom:2px solid transparent;
  padding:7px 15px;cursor:pointer;font-family:var(--mono);font-size:11.5px;white-space:nowrap;color:var(--ink-3);
}
.tab.on{border-bottom-color:var(--shu);color:var(--ink)}
.dlg-bd{padding:0;overflow:auto;max-height:60dvh;background:var(--sunk)}
pre{
  margin:0;padding:16px 18px;font-family:var(--mono);font-size:12px;line-height:1.62;
  white-space:pre;overflow-x:auto;color:var(--ink);
}
.dlg-ft{display:flex;gap:9px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.dlg-ft .stencil{margin-right:auto}
.solid{background:var(--ai);border:1px solid var(--ai);color:#fff;padding:6px 15px;cursor:pointer;font-family:var(--mono);font-size:11.5px}
.solid:hover{filter:brightness(1.12)}
.saved{color:var(--ok);font-family:var(--mono);font-size:11.5px}

@media (max-width:1080px){
  main{grid-template-columns:1fr;grid-template-rows:auto minmax(280px,1fr) auto}
  .col.left,.col.right{border:0;border-top:1px solid var(--line)}
  .col.left{order:2}.canvas-wrap{order:1}.col.right{order:3;max-height:44dvh}
  .titleblock{grid-template-columns:repeat(2,1fr)}
  .tb-list{grid-column:1/-1;max-height:90px}
  .tb-actions{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="wordmark">GRAPH<span>FLOW</span></div>
  <div class="hd-field">
    <span class="stencil">図面名</span>
    <input id="f-name" pattern="[a-z0-9][a-z0-9-]*" spellcheck="false" aria-label="図面名（コマンド名になる）">
  </div>
  <div class="hd-field" style="flex:1;min-width:200px">
    <span class="stencil">目的</span>
    <input id="f-goal" style="width:100%"
      placeholder="何について何をするのか。ここに書いた名前が全ノードの指示文に入ります"
      aria-label="このフローが達成すること">
  </div>
  <div class="hd-spacer"></div>
  <select class="ghost" id="sel-tmpl" aria-label="ひな形を読み込む"><option value="">ひな形…</option></select>
  <button class="ghost" id="btn-load">読込</button>
  <button class="ghost" id="btn-theme" title="明暗を切り替える">◐</button>
</header>

<main>
  <!-- ── 左：部品箱 ── -->
  <div class="col left"><div class="pad">
    <div class="sect">
      <span class="stencil">部品箱</span>
      <button class="part" data-k="single"><b>単発</b><i>1担当が1回で終える仕事</i></button>
      <button class="part" data-k="fanout"><b>並列</b><i>同じ仕事を、対象を変えて同時に回す</i></button>
      <button class="part" data-k="reduce"><b>整理</b><i>重複を消し件数を数える。コードでやる</i></button>
      <button class="part" data-k="verify"><b>検証</b><i>別文脈で「間違い」を探す</i></button>
      <button class="part" data-k="synthesize"><b>統合</b><i>検証を通ったものだけで仕上げる</i></button>
      <button class="part" data-k="gate"><b>人間ゲート</b><i>ここで図面が2枚に割れる</i></button>
    </div>

    <div class="sect">
      <span class="stencil">アンカー</span>
      <p class="hint">AIが言い訳できない現実。何をもって正しいとするか。</p>
      <div id="anchors"></div>
      <button class="add" id="btn-anchor">＋ 追加</button>
    </div>

    <div class="sect">
      <span class="stencil">繰り返し</span>
      <p class="hint">合格するまで同じ段を回します。止まらなくなるので、停止条件は必須です。</p>
      <div id="loopctl"></div>
    </div>

    <div class="sect">
      <span class="stencil">上限</span>
      <label class="f"><span class="stencil">総エージェント数</span>
        <input class="in" type="number" id="f-cap" min="1" max="1000"></label>
      <label class="f"><span class="stencil">1回の並列で走らせる上限</span>
        <input class="in" type="number" id="f-conc" min="1" max="16"></label>
      <p class="hint">実行側の上限は同時16・総計1000。超える設計は書き出せません。<br>⚠ 16は<b>上限であって保証値ではありません</b>。実機では CPU のコア数−2 まで落ちます（8コアなら6）。</p>
    </div>
  </div></div>

  <!-- ── 中：図面 ── -->
  <div class="canvas-wrap">
    <div class="grid-note">
      <span class="stencil">図面</span>
      <span class="legend">→ 線は依存。<b>線が入っていない仕事は、最初から同時に走ります。</b></span>
      <span class="stencil" id="scale-note">—</span>
    </div>
    <div class="canvas-inner" id="canvas"></div>
  </div>

  <!-- ── 右：ノード詳細 ── -->
  <div class="col right"><div class="pad" id="inspector"></div></div>
</main>

<!-- ── 表題欄 ── -->
<div class="titleblock">
  <div class="tb" id="tb-findings"><span class="stencil">点検</span><b>—</b></div>
  <div class="tb" id="tb-anchor"><span class="stencil">アンカー</span><b>—</b></div>
  <div class="tb" id="tb-cap"><span class="stencil">上限</span><b>—</b></div>
  <div class="tb" id="tb-gate"><span class="stencil">図面枚数</span><b>—</b></div>
  <div class="tb-list" id="tb-list"></div>
  <div class="tb-actions">
    <button class="issue" id="btn-issue" disabled>書き出す</button>
  </div>
</div>
</div>

<dialog id="dlg">
  <div class="dlg-hd">
    <span class="stencil">書き出し</span>
    <button class="ghost" id="dlg-x">閉じる</button>
  </div>
  <div class="tabs" id="dlg-tabs"></div>
  <div class="dlg-bd"><pre id="dlg-pre"></pre></div>
  <div class="dlg-ft">
    <span class="stencil" id="dlg-path"></span>
    <span class="saved" id="dlg-msg"></span>
    <button class="ghost" id="dlg-copy">コピー</button>
    <button class="ghost" id="dlg-dl">ダウンロード</button>
    <button class="solid" id="dlg-save" hidden>.claude/workflows/ に保存</button>
  </div>
</dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const esc = s => String(s ?? "").replace(/[&<>]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m]));
const jstr = s => JSON.stringify(String(s ?? ""));

const KIND = {
  single:     { ja: "単発",     phase: "実行" },
  fanout:     { ja: "並列",     phase: "並列" },
  reduce:     { ja: "整理",     phase: "整理" },
  verify:     { ja: "検証",     phase: "検証" },
  synthesize: { ja: "統合",     phase: "統合" },
  gate:       { ja: "人間ゲート", phase: "承認" },
};

let seq = 0;
const nid = () => "n" + (++seq);

let S = blank();
let sel = null;
let findings = [];

function blank() {
  return {
    name: "", goal: "", anchors: [], caps: { max: 8, conc: 5 }, nodes: [],
    // 繰り返しは部品ではなく「帯」。どの段からどの段までを、何周まで回すか。
    loop: { from: "", to: "", max: 5, dry: 2 },
  };
}

/* 読み込んだ図面を、こちらの想定する形に整える。
   ・古い版で保存した図面（繰り返しを持たない等）を開けるようにする
   ・手で編集されて壊れた図面（存在しないIDを指す線など）で落ちないようにする */
const OUT_TYPES = ["string", "number", "boolean", "array"];
function normalize(d) {
  const base = blank();
  const c = (d && d.caps) || {};
  const lp = (d && d.loop) || {};
  const s = {
    name: typeof d.name === "string" ? d.name : "",
    goal: typeof d.goal === "string" ? d.goal : "",
    anchors: Array.isArray(d.anchors) ? d.anchors.filter(x => typeof x === "string") : [],
    caps: { max: +c.max || base.caps.max, conc: +c.conc || base.caps.conc },
    loop: {
      from: typeof lp.from === "string" ? lp.from : "",
      to: typeof lp.to === "string" ? lp.to : "",
      max: +lp.max || 5, dry: +lp.dry || 2,
    },
    nodes: [],
  };
  const ids = new Set();
  (Array.isArray(d.nodes) ? d.nodes : []).forEach(n => {
    if (!n || typeof n.id !== "string" || ids.has(n.id) || !KIND[n.kind]) return;
    ids.add(n.id);
    s.nodes.push({
      id: n.id, kind: n.kind,
      title: String(n.title ?? ""), job: String(n.job ?? ""),
      items: n.kind === "fanout" ? (Array.isArray(n.items) ? n.items.map(String) : []) : null,
      outputs: Array.isArray(n.outputs)
        ? n.outputs.filter(o => o && typeof o.name === "string")
            .map(o => ({ name: o.name, type: OUT_TYPES.includes(o.type) ? o.type : "string" }))
        : [],
      fail: String(n.fail ?? ""),
      deps: Array.isArray(n.deps) ? n.deps.filter(x => typeof x === "string") : [],
      edgeChecked: !!n.edgeChecked,
      irreversible: !!n.irreversible,
      countCheck: n.kind === "reduce" ? n.countCheck !== false : false,
      target: typeof n.target === "string" ? n.target : "",
      lens: String(n.lens ?? ""),
      writesFiles: !!n.writesFiles,
      fileChecked: !!n.fileChecked,
    });
  });
  // 存在しない相手を指す線と検証対象は捨てる（読んだ瞬間に落ちないため）
  s.nodes.forEach(n => {
    n.deps = [...new Set(n.deps.filter(dp => ids.has(dp) && dp !== n.id))];
    if (!ids.has(n.target)) n.target = "";
  });
  if (!ids.has(s.loop.from) || !ids.has(s.loop.to)) { s.loop.from = ""; s.loop.to = ""; }
  return s;
}

/* 帯が今どの段からどの段に掛かっているか。段は依存から毎回引き直すので、
   帯もノードに紐づけて持ち、表示のたびに段へ変換する。 */
function loopRange() {
  const L = S.loop;
  if (!L || !L.from || !L.to) return null;
  const a = S.nodes.find(n => n.id === L.from);
  const b = S.nodes.find(n => n.id === L.to);
  if (!a || !b) return null;
  const rk = ranks();
  if (rk[a.id] == null || rk[b.id] == null || rk[b.id] < rk[a.id]) return null;
  return { a: rk[a.id], b: rk[b.id], from: a, to: b };
}

/* 帯の中の検証ノードのうち、いちばん後ろのもの。これが合否を出す。 */
function loopJudge() {
  const L = loopRange();
  if (!L) return null;
  const rk = ranks();
  const inside = S.nodes.filter(n => n.kind === "verify" && rk[n.id] >= L.a && rk[n.id] <= L.b);
  return inside.length ? inside[inside.length - 1] : null;
}

function newNode(kind) {
  /* 依存の既定値は種類で決める。
     並列と単発は「素材を取ってくる側」なので、既定は依存なし＝1段目に並ぶ。
     何も考えずに前の部品へ繋ぐと、記事が言うとおり
     「人が書いた順番」がそのまま偽のエッジになって直列化する。
     整理・検証・統合・ゲートは、定義上その前の結果を食べるので、
     まだ誰にも使われていない部品（末端）を既定の依存にする。 */
  const leaves = S.nodes.filter(n =>
    !S.nodes.some(m => m.deps.includes(n.id) || m.target === n.id));
  const downstream = kind === "reduce" || kind === "verify"
    || kind === "synthesize" || kind === "gate";
  const deps = downstream ? leaves.map(n => n.id) : [];
  return {
    id: nid(), kind,
    title: "", job: "",
    items: kind === "fanout" ? [] : null,
    outputs: kind === "gate" ? [] : [{ name: "", type: "string" }],
    fail: "",
    deps,
    edgeChecked: false,
    irreversible: false,
    countCheck: kind === "reduce",
    target: kind === "verify" ? (leaves.length === 1 ? leaves[0].id : "") : "",
    lens: "",
    writesFiles: false,   // ファイルを書き換えるか
    fileChecked: false,   // 書き換えるかどうかを人が確かめたか
  };
}

/* ══ 点検 ══════════════════════════════════════════════
   ここが本体。指摘(block)が1件でもあれば書き出せない。 */
function inspect() {
  const f = [];
  const push = (code, msg, node, warn) => f.push({ code, msg, node: node || null, warn: !!warn });
  const byId = Object.fromEntries(S.nodes.map(n => [n.id, n]));
  const work = S.nodes.filter(n => n.kind !== "gate");

  if (!/^[a-z0-9][a-z0-9-]*$/.test(S.name))
    push("K-1", "図面名は英小文字・数字・ハイフンだけ。そのままコマンド名になります", null);
  if (!S.goal.trim())
    push("K-2", "目的が空です。統合ノードが何に向かって仕上げるか決まりません", null);
  if (!S.nodes.length)
    push("K-3", "ノードがありません。左の部品箱から置いてください", null);

  for (const n of S.nodes) {
    const at = n.title || KIND[n.kind].ja;
    if (!n.title.trim()) push("K-4", `${KIND[n.kind].ja}ノードに名前がありません`, n);
    if (n.kind === "gate") continue;

    // 整理はコードで動くのでAIへの指示文を持たない。検証は観点から指示文を組み立てる。
    const needsJob = n.kind !== "reduce" && n.kind !== "verify";
    const callsAI = n.kind !== "reduce";
    if (needsJob && !n.job.trim()) push("K-5", `「${at}」に仕事の中身がありません`, n);
    const outs = n.outputs.filter(o => o.name.trim());
    if (!outs.length) push("K-6", `「${at}」に契約(OUTPUT)がありません。次のノードが読めません`, n);
    // 🔴 契約の項目名はそのままAPIのスキーマになる。
    //    日本語や空白を入れると API が 400 で弾き、実行して初めて分かる。
    const 使える名前 = /^[a-zA-Z0-9_.-]{1,64}$/;
    const 見た = new Set();
    outs.forEach(o => {
      const nm = o.name.trim();
      if (!使える名前.test(nm))
        push("K-30", `「${at}」の契約「${nm}」は項目名に使えません。英数字と _ . - だけ、64字まで（日本語や空白は API が受け付けません）`, n);
      if (見た.has(nm)) push("K-31", `「${at}」の契約「${nm}」が重複しています`, n);
      見た.add(nm);
    });
    if (callsAI && !n.fail.trim()) push("K-7", `「${at}」に失敗時の動作がありません。AIが推測で埋めます`, n);

    if (n.deps.length && !n.edgeChecked)
      push("K-8", `「${at}」の依存が偽のエッジか未検査です。`
        + `本当にその結果が要るなら「偽のエッジを検査した」にチェック、要らないなら依存を外してください`, n);
    if (n.kind === "fanout") {
      const c = n.items.filter(Boolean).length;
      if (!c) push("K-9", `「${at}」に並列で回す対象がありません`, n);
      if (c > S.caps.conc) push("K-10", `「${at}」の対象${c}件が並列上限${S.caps.conc}を超えています`, n);
    }
    if (n.kind === "reduce" && !n.countCheck)
      push("K-11", `「${at}」で件数確認をしていません。静かに欠けた1件に気づけません`, n);
    if (n.kind === "verify") {
      if (!n.target || !byId[n.target]) push("K-12", `「${at}」が誰を検証するのか未指定です`, n);
      else if (n.target === n.id) push("K-12", `「${at}」が自分自身を検証しています`, n);
      if (!n.lens.trim()) push("K-13", `「${at}」の観点が空です。3人が同じ角度で見ても独立にはなりません`, n);
    }
    if (n.irreversible) {
      const seg = segmentOf(n.id);
      const gatesBefore = order().slice(0, order().findIndex(x => x.id === n.id)).some(x => x.kind === "gate");
      if (!gatesBefore) push("K-14", `「${at}」は不可逆なのに手前に人間ゲートがありません`, n);
      void seg;
    }
  }

  if (work.length && !S.nodes.some(n => n.kind === "verify"))
    push("K-15", "検証ノードがありません。作業者だけを100体並べても誤りは100件に増えるだけです。部品箱から「検証」を置き、誰を検証するかを指定してください", null);
  if (!S.anchors.filter(a => a.trim()).length)
    push("K-16", "アンカーが未宣言です。何をもって正しいとするかが決まっていません。左の「アンカー」に、AIが言い訳できない現実を1つ以上書いてください（例: テストが通った / 入金された）", null);
  if (!S.caps.max) push("K-17", "総エージェント数の上限が未設定です", null);
  if (S.caps.max > 1000) push("K-18", "総エージェント数が実行側の上限1000を超えています", null);
  if (S.caps.conc > 16) push("K-19", "並列数が実行側の同時実行上限16を超えています（しかも16は上限で、実機ではコア数−2まで落ちます）", null);

  const est = estimate();
  if (S.caps.max && est > S.caps.max)
    push("K-20", `見積り${est}体が自分で決めた上限${S.caps.max}体を超えています`, null);
  // 見積りは設計時の数。並列と検証は上流の返却件数ぶん動くので、実行時はこれを上回りうる。
  // 上限に達したら書き出したコードが自分で止まるが、切り捨てが起きること自体は先に伝える。
  if (S.caps.max && est > S.caps.max * 0.8 && est <= S.caps.max)
    push("K-32", `見積り${est}体が上限${S.caps.max}体に迫っています。`
      + `並列と検証は上流の返却件数ぶん増えるので、実行時に上限へ当たって切り捨てが起きます。`
      + `上限を上げるか、並列の対象を減らしてください`, null, true);

  if (cyclic()) push("K-21", "依存が循環しています。順番が決まりません", null);

  /* 🔴 同じ段で2本以上が同時に走るとき、その中にファイルを書く仕事があると
     互いの変更を上書きする。記事の言う「独立しているように見えて独立していない」。
     機械には「この仕事がファイルを書くか」は分からないので、人に確かめさせる。 */
  if (!cyclic()) {
    const rk = ranks(), 同時 = {};
    S.nodes.forEach(n => {
      if (n.kind === "gate" || n.kind === "reduce") return;
      const w = n.kind === "fanout" ? Math.max(1, n.items.filter(Boolean).length) : 1;
      同時[rk[n.id]] = (同時[rk[n.id]] || 0) + w;
    });
    S.nodes.forEach(n => {
      if (n.kind === "gate" || n.kind === "reduce") return;
      if ((同時[rk[n.id]] || 0) < 2) return;          // 1本しか走らない段は関係ない
      if (!n.fileChecked)
        push("K-33", `「${n.title || KIND[n.kind].ja}」は同時に走る段にあります。`
          + `ファイルを書き換えるかどうかを確かめてください`
          + `（並列でファイルを書くと、互いの変更を上書きします）`, n);
    });
  }

  // ゲートは図面の切れ目であって仕事ではない。中身が無い図面は書き出せない。
  segments().forEach((sg, i) => {
    if (!sg.length) push("K-29", `${i + 1}枚目の図面に仕事がありません（人間ゲートだけです）`, null);
  });

  // 繰り返しの帯
  if (S.loop && (S.loop.from || S.loop.to)) {
    if (!S.loop.from || !S.loop.to)
      push("K-24", "繰り返しの範囲が半分しか決まっていません", null);
    else if (!loopRange())
      push("K-24", "繰り返しの終わりが、始まりより前の段にあります", null);
    else {
      const LR = loopRange();
      if (!loopJudge())
        push("K-25", "繰り返しの中に検証がありません。何をもって合格とするか決まらず、止まりません", null);
      if (!S.loop.max) push("K-26", "繰り返しの最大周回数が未設定です。止まらなくなります", null);
      if (!S.loop.dry) push("K-27", "空回りの判定回数が未設定です。指摘が出なくなっても回り続けます", null);
      // 実行中に人の承認は挟めない＝ゲートをまたぐ繰り返しは動かせない
      const segs = segments();
      const si = segs.findIndex(s => s.some(n => n.id === LR.from.id));
      const sj = segs.findIndex(s => s.some(n => n.id === LR.to.id));
      if (si !== sj) push("K-28", "繰り返しが人間ゲートをまたいでいます。実行中に承認は挟めません", null);
    }
  }

  // 同じ段に並んだ仕事は「まとめて」同時に走る。上限は段ごとに見る。
  if (!cyclic() && S.caps.conc) {
    const rk = ranks(), wide = {};
    S.nodes.forEach(n => {
      if (n.kind === "gate" || n.kind === "reduce") return;
      const w = n.kind === "fanout" ? Math.max(1, n.items.filter(Boolean).length) : 1;
      wide[rk[n.id]] = (wide[rk[n.id]] || 0) + w;
    });
    Object.keys(wide).map(Number).sort((a, b) => a - b).forEach((k, i) => {
      if (wide[k] > S.caps.conc)
        push("K-23", `${i + 1}段目は同時に ${wide[k]} 本になり、並列上限 ${S.caps.conc} を超えています`, null);
    });
  }

  const judge = loopJudge();
  for (const n of S.nodes) {
    if (n.kind === "gate") continue;
    if (judge && n.id === judge.id) continue;   // 判定の結果は繰り返しの停止条件が使っている
    const used = S.nodes.some(m => m.deps.includes(n.id) || m.target === n.id);
    if (!used && n.kind !== "synthesize" && S.nodes.length > 1)
      push("K-22", `「${n.title || KIND[n.kind].ja}」の結果を誰も受け取っていません`, n, true);
  }
  return f;
}

function estimate() {
  const LR = loopRange();
  const rk = LR ? ranks() : null;
  // 帯の中は最大周回数だけ繰り返し走る。見積りに掛けないと上限が意味を失う。
  const rounds = n => (LR && rk[n.id] >= LR.a && rk[n.id] <= LR.b) ? Math.max(1, S.loop.max || 1) : 1;
  return S.nodes.reduce((a, n) => a + rounds(n) *
    (n.kind === "fanout" ? Math.max(1, n.items.filter(Boolean).length)
      : n.kind === "gate" || n.kind === "reduce" ? 0 : 1), 0);
}

/* a が b に（依存をたどって）行き着くか。循環になる線を出さないために使う。 */
function reaches(a, b) {
  const seen = new Set();
  const walk = id => {
    if (id === b) return true;
    if (seen.has(id)) return false;
    seen.add(id);
    const n = S.nodes.find(x => x.id === id);
    return !!n && n.deps.some(walk);
  };
  return walk(a);
}

function cyclic() {
  const st = {};
  const walk = id => {
    if (st[id] === 1) return true;
    if (st[id] === 2) return false;
    st[id] = 1;
    const n = S.nodes.find(x => x.id === id);
    if (n) for (const d of n.deps) if (walk(d)) return true;
    st[id] = 2; return false;
  };
  return S.nodes.some(n => walk(n.id));
}

/* 依存の深さで段を決める（自動レイアウト。手で置かせない） */
function ranks() {
  const r = {}, byId = Object.fromEntries(S.nodes.map(n => [n.id, n]));
  const depth = (id, seen) => {
    if (r[id] != null) return r[id];
    if (seen.has(id)) return 0;
    seen.add(id);
    const n = byId[id];
    const d = !n || !n.deps.length ? 0 : 1 + Math.max(...n.deps.map(x => depth(x, seen)));
    return (r[id] = d);
  };
  S.nodes.forEach(n => depth(n.id, new Set()));
  return r;
}

function order() {
  const r = ranks();
  return [...S.nodes].sort((a, b) => (r[a.id] - r[b.id]) || (S.nodes.indexOf(a) - S.nodes.indexOf(b)));
}

/* 人間ゲートで図面を割る。実行中に人の入力は挟めないので、
   ゲートは「ノード」ではなく「図面の切れ目」として扱う。 */
function segments() {
  const segs = [[]];
  for (const n of order()) {
    if (n.kind === "gate") { segs[segs.length - 1].gate = n; segs.push([]); }
    else segs[segs.length - 1].push(n);
  }
  return segs.filter(s => s.length || s.gate);   // ゲートだけの図面も1枚として数える
}
function segmentOf(id) { return segments().findIndex(s => s.some(n => n.id === id)); }

/* ══ 描画 ══════════════════════════════════════════════ */
function render() {
  findings = inspect();
  drawCanvas();
  drawInspector();
  drawTitleBlock();
  drawAnchors();
  drawLoopControls();
  $("#f-name").value = S.name;
  $("#f-goal").value = S.goal;
  $("#f-cap").value = S.caps.max || "";
  $("#f-conc").value = S.caps.conc || "";
}

function badges(id) { return findings.filter(f => f.node && f.node.id === id && !f.warn).length; }

function drawCanvas() {
  const c = $("#canvas"); c.textContent = "";
  if (!S.nodes.length) {
    const e = el("div", "empty-canvas");
    e.innerHTML = "左の<b>部品箱</b>から部品を置くと、依存の深さで図面が自動で起きます。<br><br>"
      + "描く順番ではなく<b>依存だけ</b>が段を決めます。前の結果を必要としない仕事は、勝手に同じ段に並びます。"
      + "<br><br>迷ったら上の<code>ひな形</code>から実物を1枚読んでください。";
    c.appendChild(e); return;
  }
  const segs = segments();
  segs.forEach((seg, si) => {
    const band = el("div", "seg-band");
    const lb = el("span", "stencil", `図面 ${si + 1} / ${segs.length}`
      + (si > 0 ? "（承認後）" : segs.length > 1 ? "（承認前）" : ""));
    band.appendChild(lb);

    const r = ranks();
    const cols = {};
    seg.forEach(n => (cols[r[n.id]] ||= []).push(n));
    const row = el("div", "rank-row");
    const keys = Object.keys(cols).map(Number).sort((a, b) => a - b);
    const LR = loopRange();
    let loopBox = null;                    // 繰り返しの帯
    keys.forEach((k, i) => {
      const col = el("div", "rank-col");
      const head = el("div", "rank-head");
      head.appendChild(el("span", "n", `${i + 1}段目`));
      const live = cols[k].filter(n => n.kind !== "gate");
      const wide = live.reduce((a, n) => a + (n.kind === "fanout"
        ? Math.max(1, n.items.filter(Boolean).length) : n.kind === "reduce" ? 0 : 1), 0);
      if (wide > 1) head.appendChild(el("span", "sim", `同時に ${wide} 本`));
      head.appendChild(insertPicker("＋ この前に一段", `${i + 1}段目の手前に入れる`,
        kind => insertStageBefore(cols[k], kind)));
      col.appendChild(head);
      cols[k].forEach(n => col.appendChild(nodeEl(n)));

      const inLoop = LR && k >= LR.a && k <= LR.b && seg.some(n => n.id === LR.from.id);
      if (inLoop) {
        if (!loopBox) {
          loopBox = el("div", "loop-band");
          const cap = el("div", "loop-cap");
          cap.appendChild(el("span", "stencil", "繰り返す"));
          cap.appendChild(el("span", "loop-cond",
            `最大 ${S.loop.max || "?"} 周 / ${S.loop.dry || "?"} 周続けて新しい指摘が無ければ終了`));
          const j = loopJudge();
          cap.appendChild(el("span", "loop-judge",
            j ? `合否は「${j.title || "検証"}」が出す` : "🔴 合否を出す検証がありません"));
          if (!j) cap.classList.add("bad");
          loopBox.appendChild(cap);
          loopBox.appendChild(el("div", "loop-cols"));
          row.appendChild(loopBox);
        }
        loopBox.querySelector(".loop-cols").appendChild(col);
      } else {
        row.appendChild(col);
      }
    });
    // ゲートは流れの続きなので、段を変えず右端に置く
    if (seg.gate) {
      const col = el("div", "rank-col");
      const head = el("div", "rank-head");
      head.appendChild(el("span", "n", `${keys.length + 1}段目`));
      head.appendChild(el("span", "sim", "ここで人が止まる"));
      col.appendChild(head);
      col.appendChild(nodeEl(seg.gate));
      row.appendChild(col);
    }
    band.appendChild(row);
    c.appendChild(band);
  });
  $("#scale-note").textContent = `ノード ${S.nodes.length} / 図面 ${segs.length}枚 / 見積り ${estimate()}体`;
  requestAnimationFrame(drawWires);
}

/* 依存を線で引く。線が引かれていないノードは、独立して同時に走る。 */
const NS = "http://www.w3.org/2000/svg";
function drawWires() {
  const c = $("#canvas");
  const old = c.querySelector("svg.wire");
  if (old) old.remove();
  if (!S.nodes.length) return;

  const box = c.getBoundingClientRect();
  const at = id => {
    const n = c.querySelector(`[data-nid="${id}"]`);
    if (!n) return null;
    const r = n.getBoundingClientRect();
    return {
      l: r.left - box.left, r: r.right - box.left,
      t: r.top - box.top, b: r.bottom - box.top,
      cy: r.top - box.top + r.height / 2,
    };
  };

  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "wire");
  const add = (from, to, dashed) => {
    const a = at(from), b = at(to);
    if (!a || !b) return;
    // 右向きに素直に流れるとき以外は、下側を回して衝突を避ける
    const rightward = b.l >= a.r - 4;
    const x1 = rightward ? a.r : a.l + (a.r - a.l) / 2;
    const y1 = rightward ? a.cy : a.b;
    const x2 = rightward ? b.l : b.l + (b.r - b.l) / 2;
    const y2 = rightward ? b.cy : b.t;
    const p = document.createElementNS(NS, "path");
    const d = rightward
      ? `M${x1} ${y1} C${x1 + 20} ${y1}, ${x2 - 20} ${y2}, ${x2} ${y2}`
      : `M${x1} ${y1} C${x1} ${y1 + 22}, ${x2} ${y2 - 22}, ${x2} ${y2}`;
    p.setAttribute("d", d);
    if (dashed) p.setAttribute("class", "check");
    svg.appendChild(p);
    const head = document.createElementNS(NS, "polygon");
    head.setAttribute("points", rightward
      ? `${x2} ${y2},${x2 - 8} ${y2 - 4.4},${x2 - 8} ${y2 + 4.4}`
      : `${x2} ${y2},${x2 - 4.4} ${y2 - 8},${x2 + 4.4} ${y2 - 8}`);
    if (dashed) head.setAttribute("class", "check");
    svg.appendChild(head);
  };

  for (const n of S.nodes) {
    n.deps.forEach(d => add(d, n.id, false));
    if (n.kind === "verify" && n.target && !n.deps.includes(n.target)) add(n.target, n.id, true);
  }
  c.insertBefore(svg, c.firstChild);
}

function nodeEl(n) {
  // <button> の入れ子は作れないので div + role で組む（外すボタンを内側に置くため）
  const b = el("div", "node" + (sel === n.id ? " sel" : "") + (badges(n.id) ? " bad" : ""));
  b.dataset.k = n.kind;
  b.dataset.nid = n.id;
  b.setAttribute("role", "button");
  b.tabIndex = 0;
  b.setAttribute("aria-label", `${KIND[n.kind].ja}: ${n.title || "無題"}`);
  const top = el("div", "node-top");
  top.appendChild(el("span", "stencil", KIND[n.kind].ja));
  if (n.irreversible) top.appendChild(el("span", "stencil", "不可逆"));
  if (sel === n.id) {
    const x = el("button", "node-x", "×");
    x.title = "この部品を外す";
    x.setAttribute("aria-label", `${n.title || KIND[n.kind].ja} を外す`);
    x.onclick = e => { e.stopPropagation(); removeNode(n.id); };
    top.appendChild(x);
  }
  b.appendChild(top);
  const body = el("div", "node-body");
  body.appendChild(el("div", "node-title", n.title || "（無題）"));
  let meta = "";
  if (n.kind === "fanout") meta = `×${n.items.filter(Boolean).length}`;
  if (n.kind === "verify") { const t = S.nodes.find(x => x.id === n.target); meta = t ? `→ ${t.title || "?"}` : "対象未指定"; }
  if (n.kind !== "gate") { const o = n.outputs.filter(x => x.name.trim()).length; meta += (meta ? " / " : "") + `契約${o}項`; }
  if (meta) body.appendChild(el("div", "node-meta", meta));
  b.appendChild(body);
  const k = badges(n.id);
  if (k) b.appendChild(el("span", "shu-mark", String(k)));
  b.onclick = () => { sel = n.id; render(); };
  b.onkeydown = e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sel = n.id; render(); }
    if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeNode(n.id); }
  };
  return b;
}

/* 「何を入れるか」をその場で選ばせる。選んでから入る。 */
function insertPicker(label, title, onPick) {
  const s = el("select", "rank-add");
  s.title = title;
  const head = el("option", null, label); head.value = ""; s.appendChild(head);
  Object.keys(KIND).forEach(k => {
    const o = el("option", null, `　${KIND[k].ja}`); o.value = k; s.appendChild(o);
  });
  s.onchange = () => { const k = s.value; s.value = ""; if (k) onPick(k); };
  return s;
}

/* その段の手前に一段入れる。
   新しい部品はその段が持っていた依存をそのまま引き継ぎ、
   その段の部品は新しい部品を待つようになる（＝段がひとつ下がる）。
   もとの依存は消さない。消すと整理ノードが素材を見失う。 */
function insertStageBefore(group, kind) {
  const inherited = [...new Set(group.flatMap(n => n.deps))];
  const n = newNode(kind || "single");
  n.deps = inherited;
  n.edgeChecked = inherited.length > 0;   // 引き継いだ依存は元々確認済みのもの
  // newNode は「末端」から対象を推測するので、挿入時は引き継いだ依存に合わせ直す
  if (n.kind === "verify") n.target = inherited.length === 1 ? inherited[0] : "";
  const at = Math.min(...group.map(g => S.nodes.indexOf(g)));
  S.nodes.splice(at, 0, n);
  /* 🔴 その段の全員に線を引くのは「とりあえずの置き方」でしかない。
     実際にその結果を要るのは一部だけ、ということがほとんど。
     機械が勝手に引いた線なので、未検査に落として偽のエッジテストを人にやらせる。
     （人が意図したのは「一段入れる」ことであって「全員が待つ」ことではない） */
  group.forEach(g => {
    if (!g.deps.includes(n.id)) {
      g.deps.push(n.id);
      g.edgeChecked = false;
    }
  });
  sel = n.id;
  render();
  document.querySelector(".col.right").scrollTop = 0;
}

/* あとから種類を変える。種類ごとに要らない項目は落とす。 */
function changeKind(n, k) {
  if (n.kind === k) return;
  n.kind = k;
  n.items = k === "fanout" ? (n.items || []) : null;
  n.countCheck = k === "reduce";
  if (k === "verify") { if (!n.target) n.target = n.deps[0] || ""; }
  else { n.target = ""; n.lens = ""; }
  if (k === "gate") n.outputs = [];
  else if (!n.outputs || !n.outputs.length) n.outputs = [{ name: "", type: "string" }];
  render();
}

/* 部品を外す。外した部品を指していた矢印と検証対象も一緒に外す。 */
function removeNode(id) {
  S.nodes = S.nodes.filter(x => x.id !== id);
  S.nodes.forEach(x => {
    x.deps = x.deps.filter(d => d !== id);
    if (x.target === id) x.target = "";
  });
  // 繰り返しの端になっていた部品なら、繰り返しの設定も片付ける
  if (S.loop && (S.loop.from === id || S.loop.to === id)) { S.loop.from = ""; S.loop.to = ""; }
  if (sel === id) sel = null;
  render();
}

/* ══ 右欄 ══════════════════════════════════════════════ */
function drawInspector() {
  const p = $("#inspector"); p.textContent = "";
  const n = S.nodes.find(x => x.id === sel);
  if (!n) {
    const s = el("div", "sect");
    s.appendChild(el("span", "stencil", "ノード詳細"));
    s.appendChild(el("p", "hint", "図面の部品を選ぶと、ここで契約と依存を決められます。"));
    p.appendChild(s); return;
  }
  const sect = el("div", "sect");
  sect.appendChild(el("span", "stencil", KIND[n.kind].ja));
  p.appendChild(sect);

  sect.appendChild(sel_("種類", n.kind,
    Object.keys(KIND).map(k => [k, KIND[k].ja]), v => changeKind(n, v)));
  sect.appendChild(field("名前", n.title, v => n.title = v));
  if (n.kind === "gate") {
    sect.appendChild(area("何を承認するか", n.job, v => n.job = v,
      "ここで実行は一度止まり、図面が2枚に割れます。承認後の仕事は別のワークフローになります。"));
  } else {
    sect.appendChild(area("仕事の中身（そのままAIへの指示になる）", n.job, v => n.job = v,
      n.kind === "verify" ? "空のままで構いません。下の観点から検証者への指示文を組み立てます。"
        : n.kind === "reduce" ? "整理はコードで動くので、AIへの指示は要りません。" : null));

    if (n.kind === "fanout")
      sect.appendChild(area("並列で回す対象（1行1件）", n.items.join("\n"),
        v => n.items = v.split("\n").map(s => s.trim()).filter(Boolean),
        "観点でも、ファイル名でも、顧客名でもかまいません。1行がAI1体になり、"
        + "上の指示文の末尾にその1行が足されて同時に走ります。\n"
        + "⚠ 同時に走れるのは最大16。ただし16は上限で、実機ではコア数−2まで落ちます（8コアなら6）。\n"
        + "⚠ 対象だけを書くと「何についての対象か」が伝わりません。主語は目的（GOAL）に書いてください。"));

    if (n.kind === "verify") {
      sect.appendChild(sel_("検証する相手", n.target, S.nodes.filter(x => x.id !== n.id && x.kind !== "gate")
        .map(x => [x.id, x.title || KIND[x.kind].ja]), v => n.target = v));
      sect.appendChild(field("観点（角度を変える）", n.lens, v => n.lens = v));
      sect.appendChild(note("この検証者には作業者の会話履歴を渡しません。完成物と基準だけを渡し、"
        + "「間違っている理由を優先して探せ」と指示するコードを生成します。"));
    }

    if (n.kind === "reduce") {
      sect.appendChild(check("件数を確認する", n.countCheck, v => n.countCheck = v,
        "予定入力数と実際の入力数を突き合わせ、欠けていれば INCOMPLETE を立てます"));
      sect.appendChild(note("整理はLLMを呼ばず素のJavaScriptで生成します。重複削除・件数確認は"
        + "その方が安く速く確実です。"));
    }

    /* 契約 */
    const cs = el("div", "sect");
    cs.appendChild(el("span", "stencil", "契約 — OUTPUT"));
    cs.appendChild(el("p", "hint", "次のノードが迷わず読める形。文章の美しさは要りません。"));
    n.outputs.forEach((o, i) => {
      const row = el("div", "pair");
      row.appendChild(inp(o.name, "項目名", v => o.name = v));
      row.appendChild(sel_(null, o.type, [["string", "string"], ["number", "number"],
        ["boolean", "boolean"], ["array", "array"]], v => o.type = v, true));
      const x = el("button", "mini", "×");
      x.onclick = () => { n.outputs.splice(i, 1); render(); };
      row.appendChild(x);
      cs.appendChild(row);
    });
    const add = el("button", "add", "＋ 項目");
    add.onclick = () => { n.outputs.push({ name: "", type: "string" }); render(); };
    cs.appendChild(add);
    cs.appendChild(area("失敗したとき", n.fail, v => n.fail = v,
      "例: 公式情報を確認できない場合は、推測せず status を unverified にする"));
    p.appendChild(cs);
  }

  /* 依存 */
  const ds = el("div", "sect");
  ds.appendChild(el("span", "stencil", "エッジ — 依存"));
  ds.appendChild(el("p", "hint", "この仕事は、本当にその結果を必要としますか。必要ないなら外してください。同じ段に並んで同時に走ります。"));
  const wrap = el("div", "deps");
  S.nodes.filter(x => x.id !== n.id).forEach(x => {
    const t = el("button", "dep" + (n.deps.includes(x.id) ? " on" : ""), x.title || KIND[x.kind].ja);
    t.onclick = () => {
      const i = n.deps.indexOf(x.id);
      i < 0 ? n.deps.push(x.id) : n.deps.splice(i, 1);
      n.edgeChecked = false; render();
    };
    wrap.appendChild(t);
  });
  ds.appendChild(wrap);
  if (n.deps.length)
    ds.appendChild(check("偽のエッジを検査した", n.edgeChecked, v => n.edgeChecked = v,
      "残した矢印は、直前の結果が本当に要るものだけ"));
  if (n.kind !== "gate" && n.kind !== "reduce") {
    ds.appendChild(check("ファイルを書き換えるか確かめた", n.fileChecked, v => n.fileChecked = v,
      "同じ段で2本以上が同時に走るとき、機械には判断できないので人が答えます"));
    if (n.fileChecked)
      ds.appendChild(check("ファイルを書き換える", n.writesFiles, v => n.writesFiles = v,
        "ONにすると、この仕事だけ別の作業コピー（worktree）で動かします。"
        + "他の仕事と同じファイルを奪い合わなくなります"));
  }
  if (n.kind !== "gate")
    ds.appendChild(check("不可逆な行動を含む", n.irreversible, v => n.irreversible = v,
      "公開・送信・決済・削除・本番反映。手前に人間ゲートが要ります"));
  p.appendChild(ds);

  /* 下流側。段を挿入した直後は、ここで「本当に待つ必要がある仕事」だけを残す。 */
  const us = el("div", "sect");
  us.appendChild(el("span", "stencil", "この結果を待つ仕事"));
  us.appendChild(el("p", "hint",
    "外した仕事は、これを待たずに最初から走ります。段が1つ上がります。"));
  const uw = el("div", "deps");
  const cand = S.nodes.filter(x => x.id !== n.id && !reaches(n.id, x.id));
  cand.forEach(x => {
    const on = x.deps.includes(n.id);
    const t = el("button", "dep" + (on ? " on" : ""), x.title || KIND[x.kind].ja);
    t.onclick = () => {
      if (on) x.deps = x.deps.filter(d => d !== n.id);
      else { x.deps.push(n.id); x.edgeChecked = false; }
      render();
    };
    uw.appendChild(t);
  });
  if (!cand.length) us.appendChild(el("p", "hint", "（この後ろに置ける部品がありません）"));
  us.appendChild(uw);
  p.appendChild(us);

  const ins = insertPicker("＋ この部品の前に一段入れる", "この部品の手前にだけ入れる",
    k => insertStageBefore([n], k));
  ins.className = "add pick";
  p.appendChild(ins);

  const del = el("button", "add danger", "この部品を外す");
  del.onclick = () => removeNode(n.id);
  p.appendChild(del);
}

function field(label, val, on) {
  const l = el("label", "f"); l.appendChild(el("span", "stencil", label));
  l.appendChild(inp(val, "", on)); return l;
}
function inp(val, ph, on) {
  const i = el("input", "in"); i.value = val || ""; i.placeholder = ph || "";
  i.oninput = () => { on(i.value); scheduleRender(); }; return i;
}
function area(label, val, on, hint) {
  const l = el("label", "f"); l.appendChild(el("span", "stencil", label));
  const t = el("textarea", "in"); t.value = val || "";
  t.oninput = () => { on(t.value); scheduleRender(); };
  l.appendChild(t);
  if (hint) l.appendChild(el("small", "hint", hint));
  return l;
}
function sel_(label, val, opts, on, bare) {
  const s = el("select", "in");
  if (!bare) s.appendChild(el("option", null, "—")).value = "";
  opts.forEach(([v, t]) => { const o = el("option", null, t); o.value = v; s.appendChild(o); });
  s.value = val || "";
  s.onchange = () => { on(s.value); render(); };
  if (bare) return s;
  const l = el("label", "f"); l.appendChild(el("span", "stencil", label)); l.appendChild(s); return l;
}
function check(label, val, on, sub) {
  const l = el("label", "chk");
  const i = el("input"); i.type = "checkbox"; i.checked = !!val;
  i.onchange = () => { on(i.checked); render(); };
  l.appendChild(i);
  const s = el("span", null, label);
  if (sub) s.appendChild(el("small", null, sub));
  l.appendChild(s); return l;
}
function note(t) { return el("p", "hint", t); }

/* 入力中は、いま触っている欄を含む場所を作り直さない。
   render() は右パネルとヘッダの入力欄ごと作り直すので、
   タイプするたびに入力欄が消えてフォーカスが外れていた。
   文字入力で更新が要るのは図面と表題欄だけなので、そこだけ描き直す。 */
let rt = null;
function scheduleRender() { clearTimeout(rt); rt = setTimeout(liveUpdate, 180); }
function liveUpdate() {
  findings = inspect();
  drawCanvas();
  drawTitleBlock();
}

  }

  b.appendChild(el("span", "stencil", "何周 空回りしたら終了"));

function numin(val, on) {

function drawTitleBlock() {
  const block = findings.filter(f => !f.warn), warn = findings.filter(f => f.warn);

    list.appendChild(el("div", "finding", "指摘はありません。書き出せます。"));

  const btn = $("#btn-issue");
  btn.disabled = block.length > 0 || !S.nodes.length;
  btn.textContent = block.length ? `書き出せません（${block.length}）` : "書き出す";
}

/* ══ コード生成 ══════════════════════════════════════════ */

/* 人が書いた文字を、テンプレートリテラルの中へそのまま置くための逃がし。
   🔴 バッククォートだけでなく ${ } も逃がす。
   逃がさないと「価格は ${価格} 円」がJavaScriptの式として評価され、
   構文は通るのに実行時に壊れる／意図しない値が混ざる。
   \ も先に逃がさないと、\` のような入力で順番が狂う。 */
function lit(s) {
  return String(s ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/`/g, "\\`")
    .replace(/\$\{/g, "\\${");
}

function schemaOf(n) {
  const outs = n.outputs.filter(o => o.name.trim());
  const props = {}; outs.forEach(o => props[o.name.trim()] = { type: o.type });
  return { type: "object", required: outs.map(o => o.name.trim()), properties: props };
}
/* 人が書いた欄は、ここで1つずつ逃がす。
   機械側の意図的な埋め込み（${JSON.stringify(item)} など）は逃がしてはいけないので、
   文字列全体に lit() を掛けず、人の入力だけに掛ける。 */
function promptOf(n) {
  const L = [];
  L.push(lit(n.job.trim()));
  L.push("");
  L.push("GOAL: " + lit(S.goal.trim()));
  if (S.anchors.filter(Boolean).length) {
    L.push("");
    L.push("ANCHOR — 何をもって正しいとするか:");
    S.anchors.filter(Boolean).forEach(a => L.push("- " + lit(a)));
  }
  if (n.fail.trim()) { L.push(""); L.push("FAIL: " + lit(n.fail.trim())); }
  return L.join("\n");
}
function verifyPrompt(n, t) {
  return [
    "あなたは作成者ではなく、独立した検証者です。",
    "作成者の推論や会話履歴は参照しません。渡された完成物と基準だけで判断します。",
    "",
    `観点: ${lit(n.lens.trim()) || "正確性"}`,
    lit(n.job.trim()),
    "",
    "以下の主張が間違っている可能性を優先して探してください。",
    "1. 主張は出典によって本当に支持されているか",
    "2. 情報は現在も有効か",
    "3. 出典は実在し、該当内容を含んでいるか",
    "4. 数字、日付、固有名詞に矛盾がないか",
    "5. 推測が事実として書かれていないか",
    "",
    "確認できない場合は refuted ではなく unverified にします。",
    "",
    `対象（${t ? lit(t.title || t.id) : "?"} の出力）:`,
    "${JSON.stringify(item)}",   // ← これは機械側の埋め込み。逃がさない
  ].join("\n");
}

function generate() {
  const segs = segments();
  return segs.map((seg, i) => {
    const nm = segs.length > 1 ? `${S.name}-${i + 1}` : S.name;
    const phases = [...new Set(seg.map(n => KIND[n.kind].phase).filter(p => p !== "整理"))];
    const L = [];
    L.push("/* GraphFlow で作成した図面です。設計の真実源は同梱の .graphflow.json です。");
    L.push("   手で直すと次回の書き出しで上書きされます。図面側を直してください。 */");
    L.push("export const meta = {");
    L.push(`  name: ${jstr(nm)},`);
    L.push(`  description: ${jstr(S.goal || S.name)},`);
    L.push("  phases: [" + phases.map(p => `{ title: ${jstr(p)} }`).join(", ") + "],");
    L.push("}");
    L.push("");
    if (segs.length > 1) {
      L.push(`// 図面 ${i + 1}/${segs.length}。実行中に人間の承認は挟めないため、`);
      L.push("// 人間ゲートごとにワークフローを分けています。");
      if (i > 0) {
        L.push(`// 前の図面（${S.name}-${i}）の結果を args で受け取ります。`);
        L.push(`// 起動例: /${S.name}-${i + 1} に前の図面の戻り値を渡す`);
      }
      L.push("");
      if (i > 0) {
        L.push("const 前の図面 = args ?? null");
        L.push(`if (!前の図面) log("⚠ 前の図面の結果が渡されていません。/${S.name}-${i} を先に実行し、その戻り値を渡してください。")`);
        L.push("");
      }
    }
    if (S.anchors.filter(Boolean).length) {
      L.push("// アンカー（AIの合意ではなく現実の証拠）:");
      S.anchors.filter(Boolean).forEach(a => L.push("//   - " + a));
      L.push("");
    }
    L.push(`const CAP = ${S.caps.max}   // 総エージェント数の上限`);
    L.push("");
    L.push("/* 🔴 上限は宣言するだけでは何も止めない。ここで実際に止める。");
    L.push("   並列と検証は上流の返却件数ぶん動くので、書き出した時点では体数が決まらない。");
    L.push("   agent() は必ず spawn() 経由で呼ぶ（素の agent() を残さないこと）。");
    L.push("   ⚠ 返すのは素の null ではなく Promise.resolve(null)。");
    L.push("      検証は agent(...).then(...) と続くので、素の null だと即死する。 */");
    L.push("let 発火数 = 0");
    L.push("const spawn = (p, o) => {");
    L.push("  if (発火数 >= CAP) {");
    L.push("    log(`⚠ 上限 ${CAP} 体に達したので、これ以降は動かしません（${o && o.label || \"名前なし\"}）`)");
    L.push("    return Promise.resolve(null)");
    L.push("  }");
    L.push("  発火数++");
    L.push("  return agent(p, o)");
    L.push("}");
    L.push("// 残り枠まで切り詰める。切り捨てた件数は必ず出す（静かに減らさない）。");
    L.push("const 残り枠 = () => Math.max(0, Math.min(CAP - 発火数, 4096))   // 4096 = VM境界を越える配列長の上限");
    L.push("const 枠内に収める = (xs, 名) => {");
    L.push("  const 収まる = xs.slice(0, 残り枠())");
    L.push("  if (収まる.length < xs.length) log(`⚠ ${名}: ${xs.length - 収まる.length}件を上限で切り捨てました`)");
    L.push("  return 収まる");
    L.push("}");
    L.push("");

    /* 段ごとに出す。同じ段のノードは互いに依存していないので、
       ひとつの parallel に入れて本当に同時に走らせる。
       （順番に await すると、図面が「同時」と言っているのに直列に動いてしまう） */
    const rk = ranks();
    const groups = {};
    seg.forEach(n => (groups[rk[n.id]] ||= []).push(n));
    const done = new Set();

    const depsOf = n => n.deps.filter(d => done.has(d)).map(d => "r_" + d);
    // 🔴 ゲートをまたぐ依存は、この図面の中に相手がいない。
    //    黙って落とすと前の図面の結果が消えるので、args から受け取る。
    const 外を見る = n => i > 0 && n.deps.some(d => !seg.some(x => x.id === d));
    const ctxOf = n => {
      const parts = depsOf(n).map(d => "${JSON.stringify(" + d + ")}");
      if (外を見る(n)) parts.push("${JSON.stringify(前の図面)}");
      return parts.length ? `\n\n前段の結果:\n` + parts.join("\n") : "";
    };

    // エージェントを立てるノードを、await できる式1つにする
    const exprOf = n => {
      const v = "r_" + n.id;
      if (n.kind === "fanout") {
        return [
          `parallel(枠内に収める(${v}_items, ${jstr(n.title || "並列")}).map((対象) => () =>`,
          `    spawn(\`${promptOf(n)}\n\n対象: \${対象}${ctxOf(n)}\`, {`,
          `      label: \`\${対象}\`,`,
          `      phase: ${jstr(KIND[n.kind].phase)},`,
          ...(n.writesFiles ? [`      isolation: "worktree",   // 同じファイルを奪い合わないよう、別の作業コピーで動かす`] : []),
          `      schema: ${JSON.stringify(schemaOf(n))},`,
          `    })`,
          `  )).then(a => a.filter(Boolean))`,
        ].join("\n");
      }
      if (n.kind === "verify") {
        const t = S.nodes.find(x => x.id === n.target);
        const tv = t ? "r_" + t.id : "[]";
        return [
          `parallel(枠内に収める([${tv}].flat().filter(Boolean), ${jstr(n.title || "検証")}).map((item, i) => () =>`,
          `    spawn(\`${verifyPrompt(n, t)}\`, {`,
          `      label: \`検証:\${i + 1}\`,`,
          `      phase: "検証",`,
          `      schema: { type: "object", required: ["verdict", "reason"], properties: {`,
          `        verdict: { type: "string", enum: ["KEEP", "DROP", "UNVERIFIED"] },`,
          `        reason: { type: "string" },`,
          `        needed: { type: "string" } } },`,
          `    }).then(v => ({ item, ...(v || {`,
          `      // 公式仕様: agent() は中断・回復不能なAPIエラーのとき null を返す。`,
          `      // ここで落とすと、検証されなかった項目が KEEP でも DROP でもなく静かに消える。`,
          `      verdict: "UNVERIFIED",`,
          `      reason: "検証者が結果を返しませんでした（中断または回復不能なAPIエラー）",`,
          `      needed: "この項目の再検証" }) }))`,
          `  ))`,
        ].join("\n");
      }
      let viaVerify = false;
      const kept = depsOf(n).map(d => {
        const dn = S.nodes.find(x => "r_" + x.id === d);
        if (dn && dn.kind === "verify") { viaVerify = true; return d + "_kept"; }
        return d;
      });
      // 検証を通っていない材料を「検証を通ったものだけ」と書かない
      const 材料 = kept.map(d => "${JSON.stringify(" + d + ")}");
      if (外を見る(n)) 材料.push("${JSON.stringify(前の図面)}");
      const ctx2 = 材料.length
        ? `\n\n${viaVerify ? "使ってよい材料（検証を通ったものだけ）" : "前段の結果"}:\n`
          + 材料.join("\n")
        : "";
      return [
        `spawn(\`${promptOf(n)}${ctx2}\`, {`,
        `    label: ${jstr(n.title || KIND[n.kind].ja)},`,
        `    phase: ${jstr(KIND[n.kind].phase)},`,
        ...(n.writesFiles ? [`    isolation: "worktree",   // 同じファイルを奪い合わないよう、別の作業コピーで動かす`] : []),
        `    schema: ${JSON.stringify(schemaOf(n))},`,
        `  })`,
      ].join("\n");
    };

    // 走らせたあとに要る後処理（進捗ログ・検証の絞り込み）
    const postOf = n => {
      const v = "r_" + n.id;
      if (n.kind === "fanout")
        return [
          `log(\`${n.title || "並列"}: \${${v}.length}/\${${v}_items.length} 件が返りました\`)`,
          `// 上限で切り捨てた分は 枠内に収める() が別に出す。ここは「投げたのに返らなかった」だけを見る。`,
          `if (${v}.length < Math.min(${v}_items.length, CAP)) log(\`⚠ ${n.title || "並列"}: \${Math.min(${v}_items.length, CAP) - ${v}.length}件が返っていません。この段の結果は欠けています。\`)`,
        ];
      if (n.kind === "verify")
        return [
          `const ${v}_kept = ${v}.filter(x => x.verdict === "KEEP")`,
          `log(\`検証: KEEP \${${v}_kept.length} / DROP \${${v}.filter(x=>x.verdict==="DROP").length} / UNVERIFIED \${${v}.filter(x=>x.verdict==="UNVERIFIED").length}\`)`,
          `if (${v}.some(x => x.verdict === "UNVERIFIED")) log(\`⚠ \${${v}.filter(x=>x.verdict==="UNVERIFIED").length}件は検証できていません。通ったものとして扱わないでください。\`)`,
        ];
      // 単発・統合も agent() なので null で返りうる。黙って次の段に渡さない。
      return [`if (!${v}) log(${jstr("⚠ 「" + (n.title || KIND[n.kind].ja) + "」が結果を返しませんでした（中断または回復不能なAPIエラー）。この先は、この結果なしで進みます。")})`];
    };

    /* 繰り返しの帯。実行中に人の入力は挟めないので、帯は1枚の図面に収まっている
       （またぐ設計は点検が K-28 で止める）。 */
    const LR = loopRange();
    const inThisSeg = LR && seg.some(n => n.id === LR.from.id);
    const looped = n => inThisSeg && rk[n.id] >= LR.a && rk[n.id] <= LR.b;
    const asg = n => looped(n) ? `r_${n.id} = ` : `const r_${n.id} = `;

    for (const k of Object.keys(groups).map(Number).sort((a, b) => a - b)) {
      const g = groups[k];

      if (inThisSeg && k === LR.a) {
        const body = seg.filter(looped);
        L.push("// 繰り返しの中で作り直す値は、外に出しておく");
        body.forEach(n => {
          L.push(`let r_${n.id}`);
          if (n.kind === "verify") L.push(`let r_${n.id}_kept`);
        });
        // 対象リストは毎周同じなので外に出す
        body.filter(n => n.kind === "fanout").forEach(n =>
          L.push(`const r_${n.id}_items = ${JSON.stringify(n.items.filter(Boolean), null, 2)}`));
        L.push("");
        L.push(`const 最大周回 = ${S.loop.max}`);
        L.push(`const 空回りで終了 = ${S.loop.dry}`);
        L.push("let 周 = 0, 空回り = 0, 未確認の残り = 0");
        L.push("const 既知の指摘 = new Set()");
        L.push("");
        L.push(`// ┌─ 繰り返す（${LR.a + 1}段目〜${LR.b + 1}段目）`);
        L.push("//    合格するまで。止まらないので、周回数と空回りの両方で必ず抜ける。");
        L.push("while (周 < 最大周回 && 空回り < 空回りで終了) {");
        L.push("周++");
        L.push("log(`繰り返し ${周}周目（最大 ${最大周回}）`)");
        L.push("");
      }
      // 整理はコードなので先に置く（エージェントを立てず、同じ段の誰も待たない）
      for (const n of g.filter(x => x.kind === "reduce")) {
        const v = "r_" + n.id;
        const dep = depsOf(n);
        const src = dep[0] || "[]";
        L.push(`// 整理はLLMを呼びません。重複削除と件数確認は素のコードの方が安く速く確実です。`);
        L.push(`const ${v}_in = [${dep.join(", ")}].flat().filter(Boolean)`);
        L.push(`const ${v}_seen = new Set()`);
        L.push(`${asg(n)}${v}_in.filter(x => {`);
        L.push("  const k = JSON.stringify(x)");
        L.push(`  if (${v}_seen.has(k)) return false`);
        L.push(`  ${v}_seen.add(k); return true`);
        L.push("})");
        if (n.countCheck) {
          // 「重複で減った」と「返ってこなかった」は別物。欠損だけを INCOMPLETE にする。
          // 並列は投入数、単発は1本として数える。数え落とすと欠損に気づけない。
          const srcs = n.deps
            .map(d => S.nodes.find(x => x.id === d))
            .filter(dn => dn && dn.kind !== "reduce" && dn.kind !== "gate");
          const exp = srcs.map(dn => dn.kind === "fanout" ? `r_${dn.id}_items.length` : "1");
          const got = srcs.map(dn => dn.kind === "fanout" ? `r_${dn.id}.length` : `(r_${dn.id} ? 1 : 0)`);
          L.push(`// 静かに失敗した1件を完成扱いにしないための件数確認`);
          if (srcs.length) {
            L.push(`const ${v}_expected = ${exp.join(" + ")}`);
            L.push(`const ${v}_returned = ${got.join(" + ")}`);
          } else {
            L.push(`const ${v}_expected = ${v}_in.length`);
            L.push(`const ${v}_returned = ${v}_in.length`);
          }
          L.push(`const ${v}_missing = ${v}_expected - ${v}_returned`);
          L.push(`const ${v}_status = ${v}_missing === 0 ? "OK" : "INCOMPLETE"`);
          L.push(`log(\`整理: 予定 \${${v}_expected} / 実際 \${${v}_returned}\``);
          L.push(`  + \` / 欠損 \${${v}_missing} / 状態 \${${v}_status} — 重複を除いて \${${v}.length}件\`)`);
          L.push(`if (${v}_status === "INCOMPLETE") log("⚠ 返らなかった仕事があります。この結果を完成として扱わないでください。")`);
        }
        void src;
        L.push("");
        done.add(n.id);
      }

      const agents = g.filter(x => x.kind !== "reduce");
      if (!agents.length) continue;

      L.push(`phase(${jstr(KIND[agents[0].kind].phase)})`);
      for (const n of agents.filter(x => x.kind === "fanout"))
        if (!looped(n)) L.push(`const r_${n.id}_items = ${JSON.stringify(n.items.filter(Boolean), null, 2)}`);
      if (agents.some(x => x.kind === "verify"))
        L.push("// 検証者には作業者の会話履歴を渡しません。完成物と基準だけを渡します。");

      if (agents.length === 1) {
        L.push(`${asg(agents[0])}await ${exprOf(agents[0])}`);
      } else {
        L.push(`// この段の ${agents.length} 本は互いに依存していないので、まとめて同時に走らせます。`);
        const tmp = `_段${k}`;
        L.push(`const ${tmp} = await parallel([`);
        agents.forEach(n => L.push(`  () => ${exprOf(n)},`));
        L.push("])");
        agents.forEach((n, i) => L.push(`${asg(n)}${tmp}[${i}]`));
      }
      agents.forEach(n => {
        postOf(n).forEach(x => L.push(looped(n) && /^const (r_\w+_kept)/.test(x)
          ? x.replace(/^const /, "") : x));
        done.add(n.id);
      });
      L.push("");

      if (inThisSeg && k === LR.b) {
        const j = loopJudge();
        const jv = j ? "r_" + j.id : null;
        if (jv) {
          L.push("// 合否。まだ落ちているもののうち、前の周に無かったものだけを「新しい指摘」と数える。");
          L.push(`const 未合格 = ${jv}.filter(v => v.verdict === "DROP")`);
          L.push("const 印 = v => JSON.stringify(v.item ?? v.reason ?? v)");
          L.push("const 新しい指摘 = 未合格.filter(v => !既知の指摘.has(印(v)))");
          L.push("新しい指摘.forEach(v => 既知の指摘.add(印(v)))");
          L.push("if (新しい指摘.length === 0) 空回り++; else 空回り = 0");
          L.push("// 検証できなかったものは「通った」ではない。合格の判定に混ぜない。");
          L.push(`未確認の残り = ${jv}.filter(v => v.verdict === "UNVERIFIED").length`);
          L.push("log(`${周}周目: 未合格 ${未合格.length}件 / 未確認 ${未確認の残り}件"
            + " / 新しい指摘 ${新しい指摘.length}件`"
            + " + ` / 空回り ${空回り}/${空回りで終了}`)");
          L.push("if (未合格.length === 0 && 未確認の残り === 0) { log(`${周}周目で全部通りました`); break }");
        }
        L.push("}");
        L.push("// └─ 繰り返し ここまで");
        L.push("if (周 >= 最大周回) log(`⚠ ${最大周回}周まで回しましたが終わっていません。残りは人が見てください。`)");
        if (jv) L.push("if (未確認の残り > 0) log(`⚠ ${未確認の残り}件は検証できないまま終わりました。通ったものとして扱わないでください。`)");
        L.push("");
      }
    }

    if (seg.gate) {
      L.push("// ── 人間ゲート ──────────────────────────────");
      L.push(`// ${seg.gate.title || "承認"}`);
      if (seg.gate.job.trim()) seg.gate.job.trim().split("\n").forEach(x => L.push("// " + x));
      L.push("// 実行中に人間の入力は挟めません。ここで一度止め、");
      L.push(`// 承認できたら /${S.name}-${i + 2} を人が起動します。`);
      L.push("");
    }

    const last = seg[seg.length - 1];
    if (last) {
      // 最後の段が null で返ったまま「結果」として返さない
      const 複数 = last.kind === "fanout" || last.kind === "verify" || last.kind === "reduce";
      L.push("const 完成 = " + (複数 ? `r_${last.id}.length > 0` : `!!r_${last.id}`));
      L.push('if (!完成) log("⚠ 最後の段が結果を返していません。この戻り値を完成物として扱わないでください。")');
      L.push(`return { result: r_${last.id}, status: 完成 ? "OK" : "INCOMPLETE", cap: CAP }`);
    } else {
      L.push("return { result: null, status: \"INCOMPLETE\", cap: CAP }   // この図面には仕事がありません");
    }
    return { file: nm + ".js", code: L.join("\n") };
  });
}

/* ══ 書き出し ══════════════════════════════════════════ */
let tabs = [], cur = 0;
function issue() {
  const gen = generate();
  tabs = [...gen, { file: S.name + ".graphflow.json", code: JSON.stringify(S, null, 2) }];
  cur = 0; drawDialog(); $("#dlg").showModal();
}
function drawDialog() {
  const t = $("#dlg-tabs"); t.textContent = "";
  tabs.forEach((x, i) => {
    const b = el("button", "tab" + (i === cur ? " on" : ""), x.file);
    b.onclick = () => { cur = i; drawDialog(); };
    t.appendChild(b);
  });
  $("#dlg-pre").textContent = tabs[cur].code;
  $("#dlg-msg").textContent = "";
  const split = tabs.length > 2 ? `人間ゲートで ${tabs.length - 1} 枚に割れています。` : "";
  $("#dlg-path").textContent = split + (window.__GRAPHFLOW_LOCAL__
    ? "" : ".js を .claude/workflows/ に置くと /図面名 で起動できます");
  $("#dlg-save").hidden = !window.__GRAPHFLOW_LOCAL__;
}

/* 依存を添字で明示する版。分岐や合流があるひな形はこちらで書く。 */
function buildGraph(name, goal, anchors, caps, rows) {
  seq = 0;
  const s = blank();
  s.name = name; s.goal = goal; s.anchors = anchors; s.caps = caps;
  const made = [];
  for (const r of rows) {
    const prev = S; S = s;               // newNode が末端を見るので一時的に差し替える
    const n = newNode(r.k);
    S = prev;
    n.title = r.t; n.job = r.j || "";
    n.deps = (r.d || []).map(i => made[i].id);
    n.edgeChecked = true;
    n.fileChecked = true;
    n.writesFiles = !!r.writes;
    if (r.items) n.items = r.items;
    if (r.o) n.outputs = r.o.map(([nm, ty]) => ({ name: nm, type: ty }));
    if (r.f) n.fail = r.f;
    if (r.k === "verify") { n.target = made[r.d[0]].id; n.lens = r.lens || ""; }
    s.nodes.push(n); made.push(n);
  }
  return s;
}

function build(name, goal, anchors, caps, rows) {
  seq = 0;
  const s = blank();
  s.name = name; s.goal = goal; s.anchors = anchors; s.caps = caps;
  let prev = null;
  for (const [kind, title, job, items, outs, fail, lens] of rows) {
    const n = newNode(kind);
    n.title = title; n.job = job || ""; n.deps = prev ? [prev.id] : [];
    n.edgeChecked = true;
    n.fileChecked = true;
    if (items) n.items = items;
    if (outs) n.outputs = outs.map(([nm, ty]) => ({ name: nm, type: ty }));
    if (fail) n.fail = fail;
    if (kind === "verify") { n.target = prev ? prev.id : ""; n.lens = lens || ""; }
    if (kind === "gate") n.irreversible = false;
    s.nodes.push(n); prev = n;
  }
  return s;
}

const selT = $("#sel-tmpl");
Object.keys(TEMPLATES).forEach(k => {
  const o = el("option", null, k); o.value = k; selT.appendChild(o);
});
selT.onchange = () => {
  const k = selT.value;
  selT.value = "";
  if (!k) return;
  if (S.nodes.length && !confirm("いま描いている図面は消えます。ひな形を読み込みますか？")) return;
  S = TEMPLATES[k](); sel = null; render();
};

$("#btn-load").onclick = () => {
  const inp = el("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.nodes)) throw new Error("nodes がありません");
        S = normalize(d); seq = S.nodes.length;
        S.nodes.forEach(n => { const m = /^n(\d+)$/.exec(n.id); if (m) seq = Math.max(seq, +m[1]); });
        sel = null; render();
      } catch (e) { alert("この図面は読めません: " + e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
};

$("#dlg-dl").onclick = () => {
  const b = new Blob([tabs[cur].code], { type: "text/plain" });
  const a = el("a"); a.href = URL.createObjectURL(b); a.download = tabs[cur].file; a.click();
  URL.revokeObjectURL(a.href); $("#dlg-msg").textContent = "保存しました";
};
$("#dlg-save").onclick = async () => {
  $("#dlg-msg").textContent = "保存中…";
  try {
    const res = await fetch("/write", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ files: tabs.map(t => ({ name: t.file, code: t.code })) }),
    });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || res.statusText);
    $("#dlg-msg").textContent = `${j.written.length}件を保存しました → /${S.name}`;
  } catch (e) { $("#dlg-msg").textContent = "保存できませんでした: " + e.message; }
};

$("#btn-theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  next ? document.documentElement.setAttribute("data-theme", next)
       : document.documentElement.removeAttribute("data-theme");
};

/* graphflow コマンドから図面を渡された場合はそれを開く */
if (window.__GRAPHFLOW_PRELOAD__ && Array.isArray(window.__GRAPHFLOW_PRELOAD__.nodes)) {
  S = normalize(window.__GRAPHFLOW_PRELOAD__);
  seq = S.nodes.length;
  S.nodes.forEach(n => { const m = /^n(\d+)$/.exec(n.id); if (m) seq = Math.max(seq, +m[1]); });
}

render();
</script>
</body>
