/* 🔴 min / max は「見た目の上の飾り」でしかない。type=number の欄は
   範囲外の値をそのまま持てるので、欄の数字・下の目安・保存される値が食い違う。
   打った端から実際に丸め、欄の表示も同時に直す。 */
function numin(val, on, 丸める) {
  const i = el("input", "in"); i.type = "number"; i.min = "1"; i.max = "50";
  i.value = val || "";
  const 収める = () => {
    if (i.value === "") return 0;                 // 打ち込み途中の空欄は触らない
    let v = Math.floor(+i.value);
    if (!Number.isFinite(v)) v = +i.min;
    v = Math.min(+i.max, Math.max(+i.min, v));
    if (String(v) !== i.value) i.value = String(v);
    return v;
  };
  i.oninput = () => { on(丸める ? 収める() : (+i.value || 0)); scheduleRender(); };
  // 空のまま離れたら下限に寄せる（保存される値と欄の見た目を必ず合わせる）
  i.onchange = () => { if (丸める && i.value === "") { i.value = i.min; on(+i.min); scheduleRender(); } };
  return i;
}

function drawAnchors() {
  const w = $("#anchors"); w.textContent = "";
  S.anchors.forEach((a, i) => {
    const row = el("div", "pair"); row.style.gridTemplateColumns = "1fr 26px";
    row.appendChild(inp(a, "例: テストが通った / 入金された", v => S.anchors[i] = v));
    const x = el("button", "mini", "×");
    x.title = "このアンカーを消す";
    x.setAttribute("aria-label", `アンカー${i + 1}行目を消す`);
    x.onclick = () => {
      snapshot();                        // 消したアンカーも1手で戻せるようにする
      S.anchors.splice(i, 1); render();
      // 続けて整理できるよう、隣の行か「＋ 追加」へフォーカスを渡す
      const ms = [...document.querySelectorAll("#anchors .mini")];
      (ms[Math.min(i, ms.length - 1)] || $("#btn-anchor")).focus();
    };
    row.appendChild(x); w.appendChild(row);
  });
}

function drawTitleBlock() {
  const block = findings.filter(f => !f.warn), warn = findings.filter(f => f.warn);
  const set = (id, txt, cls) => {
    const n = $(id); n.querySelector("b").textContent = txt;
    n.className = "tb" + (cls ? " " + cls : "");
  };
  set("#tb-findings", block.length ? `${block.length}件` : warn.length ? `注意${warn.length}` : "済",
    block.length ? "flag" : "pass");
  const ac = S.anchors.filter(a => a.trim()).length;
  set("#tb-anchor", ac ? `${ac}件` : "未", ac ? "pass" : "flag");
  /* 🔴 上限を超えている数字を出しているのはこのタイルなのに、黒いままだった。
     どこが悪いのかを一目で分からせる。 */
  const 見積り = estimate();
  set("#tb-cap", S.caps.max ? `${見積り} / ${S.caps.max}` : "未",
    !S.caps.max || 見積り > S.caps.max ? "flag" : "");
  set("#tb-gate", S.nodes.length ? `${segments().length || 1}枚` : "—");

  const list = $("#tb-list"); list.textContent = "";
  [...block, ...warn].forEach(f => {
    const b = el("button", "finding" + (f.warn ? " warn" : ""));
    b.appendChild(el("code", null, f.code));
    b.appendChild(el("span", null, f.msg));
    /* 指摘を押したら、その部品まで図面を動かして光らせる。
       どこが悪いのかを目で探させない。 */
    b.onclick = () => {
      const 動き = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
      if (!f.node) {
        // 部品に紐づかない指摘（図面名・目的・アンカー・上限）は、直す欄そのものへ案内する
        const t = f.at && document.querySelector(f.at);
        if (!t) return;
        t.scrollIntoView({ block: "center", behavior: 動き });
        t.classList.add("flash");
        setTimeout(() => t.classList.remove("flash"), 900);
        t.focus?.();
        return;
      }
      sel = f.node.id; render();
      const t = document.querySelector(`#canvas .node[data-nid="${f.node.id}"]`);
      if (t) {
        t.scrollIntoView({ block: "center", inline: "center", behavior: 動き });
        t.classList.add("flash");
        setTimeout(() => t.classList.remove("flash"), 900);
      }
      document.querySelector(".col.right").scrollTop = 0;
    };
    list.appendChild(b);
  });
  if (!findings.length && S.nodes.length)
    list.appendChild(el("div", "finding", "指摘はありません。書き出せます。"));

  const btn = $("#btn-issue");
  btn.disabled = block.length > 0 || !S.nodes.length;
  btn.textContent = block.length ? `書き出せません（${block.length}）` : "書き出す";
}

/* ══ コード生成 ══════════════════════════════════════════ */

/* 人が書いた文字を、テンプレートリテラルの中へそのまま置くための逃がし。
   🔴 バッククォートだけでなく ${ } も逃がす。
   逃がさないと「価格は ${価格} 円」がJavaScriptの式として評価され、
   構文は通るのに実行時に壊れる／意図しない値が混ざる。
   \ も先に逃がさないと、\` のような入力で順番が狂う。 */
/* 空白だけの行を落とし、前後の空白も落とした「実際に効くアンカー」。
   点検・件数表示・書き出しが同じ物差しを使うための1か所。 */
function 生きたアンカー() { return S.anchors.map(a => String(a ?? "").trim()).filter(Boolean); }

function lit(s) {
  return String(s ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/`/g, "\\`")
    .replace(/\$\{/g, "\\${");
}

/* 契約を JSON Schema にする。
   🔴 既定は「1体が1件だけ返す」。調べ物の段でこれをそのまま使うと、
      4本立てても材料が4件しか集まらない。「1体が複数件返す」を選んだときは
      契約ごと配列で包み、要素の側に同じ必須項目を掛ける
      （包まずに array 型の項目を1つ置くと、要素の中身が縛れなくなる）。 */
function schemaOf(n) {
  const outs = n.outputs.filter(o => o.name.trim());
  const props = {}; outs.forEach(o => props[o.name.trim()] = { type: o.type });
  const one = { type: "object", required: outs.map(o => o.name.trim()), properties: props };
  if (n.kind !== "fanout" || !n.multi) return one;
  return { type: "object", required: ["items"], properties: { items: { type: "array", minItems: 1, items: one } } };
}
/* 人が書いた欄は、ここで1つずつ逃がす。
   機械側の意図的な埋め込み（${JSON.stringify(item)} など）は逃がしてはいけないので、
   文字列全体に lit() を掛けず、人の入力だけに掛ける。 */
function promptOf(n) {
  const L = [];
  L.push(lit(n.job.trim()));
  L.push("");
  L.push("GOAL: " + lit(S.goal.trim()));
  /* 🔴 空白だけの行は「無い」のと同じ。画面の件数は無視しているのに、
     書き出したコードには中身のない箇条書きが並んでいた。同じ物差しで数える。 */
  if (生きたアンカー().length) {
    L.push("");
    L.push("ANCHOR — 何をもって正しいとするか:");
    生きたアンカー().forEach(a => L.push("- " + lit(a)));
  }
  if (n.fail.trim()) { L.push(""); L.push("FAIL: " + lit(n.fail.trim())); }
  return L.join("\n");
}
/* 🔴 検証者は「検証する相手」の出力しか読まない。
   「決めた基準どおりか」を見る検証で、基準そのものが別のノードにあると、
   答案だけ渡されて採点しろと言われた状態になる（実測で UNVERIFIED が返った）。
   だから基準は、相手とは別枠で、ここから明示的に手渡す。 */
function verifyPrompt(n, t, 基準) {
  const V = VKINDS[n.vkind] || VKINDS.fact;
  const 基準行 = (基準 && 基準.length) ? [
    "",
    "判定の基準（これに照らして見ます。ここに無いことを基準にしないでください）:",
    ...基準,
  ] : [];
  return [
    "あなたは作成者ではなく、独立した検証者です。",
    "作成者の推論や会話履歴は参照しません。渡された完成物と基準だけで判断します。",
    "",
    `確かめること: ${V.ja}`,
    `観点: ${lit(n.lens.trim()) || "正確性"}`,
    lit(n.job.trim()),
    "",
    "以下を、通っていない可能性の方を優先して見てください。",
    ...V.asks.map((a, i) => `${i + 1}. ${a}`),
    "",
    `KEEP = ${V.keep} / DROP = ${V.drop}`,
    "確かめようがない場合は DROP ではなく UNVERIFIED にします。",
    "",
    `対象（${t ? lit(t.title || t.id) : "?"} の出力）:`,
    "${JSON.stringify(item)}",   // ← これは機械側の埋め込み。逃がさない
    ...基準行,
  ].join("\n");
}

function generate() {
  const segs = segments();
  return segs.map((seg, i) => {
    const nm = segs.length > 1 ? `${S.name}-${i + 1}` : S.name;
    const phases = [...new Set(seg.map(n => KIND[n.kind].phase).filter(p => p !== "整理"))];
    const L = [];
    L.push("/* GraphFlow で作成した図面です。設計の真実源は同梱の .graphflow.json です。");
    L.push("   手で直すと次回の書き出しで上書きされます。図面側を直してください。 */");
    L.push("export const meta = {");
    L.push(`  name: ${jstr(nm)},`);
    L.push(`  description: ${jstr(S.goal || S.name)},`);
    L.push("  phases: [" + phases.map(p => `{ title: ${jstr(p)} }`).join(", ") + "],");
    L.push("}");
    L.push("");
    if (segs.length > 1) {
      L.push(`// 図面 ${i + 1}/${segs.length}。実行中に人間の承認は挟めないため、`);
      L.push("// 人間ゲートごとにワークフローを分けています。");
      if (i > 0) {
        L.push(`// 前の図面（${S.name}-${i}）の結果を args で受け取ります。`);
        L.push(`// 起動例: /${S.name}-${i + 1} に前の図面の戻り値を渡す`);
      }
      L.push("");
      if (i > 0) {
        L.push("const 前の図面 = args ?? null");
        L.push(`if (!前の図面) log("⚠ 前の図面の結果が渡されていません。/${S.name}-${i} を先に実行し、その戻り値を渡してください。")`);
        L.push("");
      }
    }
    /* 1枚目だけが、外から起動時の入力を受け取る。
       実行中に人へ聞けないので、聞きたいことはここで受け取るしかない。 */
    if (i === 0 && S.input.name.trim()) {
      const 例 = S.input.sample.trim() || `ここに${S.input.name}を書く`;
      L.push(`// 起動時に受け取るもの: ${lit(S.input.name)}`);
      if (S.input.desc.trim()) L.push(`//   ${lit(S.input.desc)}`);
      L.push(`// こう打って起動します:  /${nm} ${lit(例)}`);
      L.push("const 入力 = args ?? null");
      L.push(`if (入力 == null) {`);
      L.push(`  log("⚠ ${lit(S.input.name)} が渡されていません。こう打ってください: /${nm} ${lit(例)}")`);
      L.push(`  return { result: null, status: "INCOMPLETE", 足りないもの: ${jstr(S.input.name)} }`);
      L.push("}");
      L.push("");
    }
    if (生きたアンカー().length) {
      L.push("// アンカー（AIの合意ではなく現実の証拠）:");
      生きたアンカー().forEach(a => L.push("//   - " + a));
      L.push("");
    }
    L.push(`const CAP = ${S.caps.max}   // 総エージェント数の上限`);
    L.push("");
    L.push("/* 🔴 上限は宣言するだけでは何も止めない。ここで実際に止める。");
    L.push("   並列と検証は上流の返却件数ぶん動くので、書き出した時点では体数が決まらない。");
    L.push("   agent() は必ず spawn() 経由で呼ぶ（素の agent() を残さないこと）。");
    L.push("   ⚠ 返すのは素の null ではなく Promise.resolve(null)。");
    L.push("      検証は agent(...).then(...) と続くので、素の null だと即死する。 */");
    L.push("let 発火数 = 0");
    L.push("/* 🔴 この3つは spawn の外に置くこと。中に置くと呼ぶたびに初期化され、");
    L.push("   「一度でも成功した」の記憶が毎回消えて、判定が効かなくなる。 */");
    L.push("let 担当は実在した = false        // 一度でも成功したら、以後は絶対に制限を外さない");
    L.push("let 担当は不在と判定済み = false");
    L.push("const 不在のしるし = /agent ?type|subagent|agent .*not found|unknown agent|見つかりません/i");
    L.push("const spawn = (p, o) => {");
    L.push("  if (発火数 >= CAP) {");
    L.push("    log(`⚠ 上限 ${CAP} 体に達したので、これ以降は動かしません（${o && o.label || \"名前なし\"}）`)");
    L.push("    return Promise.resolve(null)");
    L.push("  }");
    L.push("  発火数++");
    L.push("  if (!o || !o.agentType) return agent(p, o)");
    L.push("  /* 🔴 「書き換えない」段は、指示ではなく道具を取り上げて止める。");
    L.push("     実測で、テストする担当がテストしながら自分でコードを直し、自分が直した");
    L.push("     ものをテストして「失敗0件」と報告した。次の段には直すものが残らず、");
    L.push("     検証者は「直すものが無いのは正しい」と合格を出した。");
    L.push("     ＝実際に行われた変更を、誰も検証しないまま通る。指示では止まらなかった。");
    L.push("     ⚠ この担当はプラグインが持っている。プラグインを入れずにこのファイルだけを");
    L.push("        置いた場合は見つからないので、そのときは書ける状態で続ける。");
    L.push("        ただし黙って落とさない。必ず言う。");
    L.push("     🔴 やってはいけない＝失敗を全部「担当が見つからない」と読むこと。");
    L.push("        実測（2026-08-08）：担当は実在していたのに、走行中に途中で止められた");
    L.push("        4つの仕事が、そのまま書ける担当で走り直された。落ちた理由は不在ではなく");
    L.push("        時間切れだった。＝止めるための仕組みが、負荷がかかった瞬間に自分で外れる。");
    L.push("        ゆえに、外してよいのは次の2つを両方満たすときだけにする。");
    L.push("          ① 失敗の中身が「その担当が居ない」と言っている");
    L.push("          ② まだ一度も、その担当で成功していない");
    L.push("        一度でも成功していれば担当は実在する。以後どんな失敗が出ても外さない。 */");
    L.push("  if (担当は不在と判定済み) return agent(p, (({ agentType, ...書ける }) => 書ける)(o))");
    L.push("  return agent(p, o).then(r => { 担当は実在した = true; return r }).catch(e => {");
    L.push("    const 中身 = (e && e.message) || String(e)");
    L.push("    if (担当は実在した || !不在のしるし.test(中身)) {");
    L.push("      log(`⚠ 「${o.label || \"名前なし\"}」が落ちました（${中身}）。`");
    L.push("        + ` 担当が居ないせいではないので、書ける状態には落としません。`");
    L.push("        + ` この仕事は結果なしとして扱います。`)");
    L.push("      return null");
    L.push("    }");
    L.push("    担当は不在と判定済み = true");
    L.push("    const { agentType, ...書ける } = o");
    L.push("    log(`⚠ 「${o.label || \"名前なし\"}」を、ファイルを書けない担当で走らせようとしましたが`");
    L.push("      + ` 見つかりませんでした（${中身}）。書ける状態のまま続けます。`");
    L.push("      + ` この段が成果物を書き換えても、機械には止められません。`");
    L.push("      + ` 止めるにはプラグインとして入れてください: /plugin install graphflow@hangout`)");
    L.push("    return agent(p, 書ける)");
    L.push("  })");
    L.push("}");
    /* 🔴 上限を、手前の段が食い尽くさないようにする。
       検証は上流の返却件数ぶん増えるので、放っておくと枠を全部使う。
       すると最後の「まとめる」が1体も立たず、そこまでの調査が丸ごと無駄になる
       （実測: 46件の調査が集まったのに報告書が出ず、戻り値が空になった）。
       だから「この段より後ろで、必ず1体ずつ要る仕事」の数を先に取り置く。 */
    L.push("// 残り枠まで切り詰める。切り捨てた件数は必ず出す（静かに減らさない）。");
    L.push("// 予約ぶん＝この後ろで必ず要る仕事の数。手前の段に食わせない。");
    L.push("const 残り枠 = (予約 = 0) => Math.max(0, Math.min(CAP - 発火数 - 予約, 4096))   // 4096 = VM境界を越える配列長の上限");
    L.push("const 枠内に収める = (xs, 名, 予約 = 0) => {");
    L.push("  const 収まる = xs.slice(0, 残り枠(予約))");
    L.push("  if (収まる.length < xs.length) log(`⚠ ${名}: ${xs.length - 収まる.length}件を上限で切り捨てました`");
    L.push("    + (予約 ? `（この後ろの仕事のために ${予約}体ぶん空けています）` : \"\"))");
    L.push("  return 収まる");
    L.push("}");
    L.push("");

    /* 段ごとに出す。同じ段のノードは互いに依存していないので、
       ひとつの parallel に入れて本当に同時に走らせる。
       （順番に await すると、図面が「同時」と言っているのに直列に動いてしまう） */
    const rk = ranks();
    const groups = {};
    seg.forEach(n => (groups[rk[n.id]] ||= []).push(n));
    const done = new Set();

    /* 🔴 worktree 分離は「並列でファイルを奪い合う」ときだけ要る。
       直列のノードに付けると、修正が使い捨ての作業コピーに入って
       本物のリポジトリに届かない。同じ段に2本以上あるときだけ出す。 */
    const 同時本数 = {};
    S.nodes.forEach(x => {
      if (x.kind === "gate" || x.kind === "reduce") return;
      const w = x.kind === "fanout" ? Math.max(1, x.items.filter(Boolean).length) : 1;
      同時本数[rk[x.id]] = (同時本数[rk[x.id]] || 0) + w;
    });
    const 分離が要る = n => n.writesFiles && (同時本数[rk[n.id]] || 0) > 1;
    /* 🔴 「書き換えない」と答えた段は、指示ではなく道具を取り上げて止める。
       拒否リスト方式なので、ブラウザ操作(MCP)も読むことも今までどおりできる。
       外れるのは Edit / Write / NotebookEdit / Bash / PowerShell / Agent だけ。
       Bash を残すと `printf > file` や `rm -f` で書けてしまい（実測で両方使われた）、
       Agent を残すと別の担当を呼んで書けてしまうので、この2つは外さないと嘘になる。
       ＝コマンドの実行が要る段は「書き換える」と答えるのが正しい。 */
    const 書けなくする = n =>
      n.fileChecked && !n.writesFiles
        ? [`      agentType: "graphflow:no-write",   // ファイルを書く道具を持たせない`]
        : [];

    const depsOf = n => n.deps.filter(d => done.has(d)).map(d => "r_" + d);
    // 🔴 ゲートをまたぐ依存は、この図面の中に相手がいない。
    //    黙って落とすと前の図面の結果が消えるので、args から受け取る。
    const 外を見る = n => i > 0 && n.deps.some(d => !seg.some(x => x.id === d));
    // 起動時の入力は、1段目（依存のない仕事）に渡す
    const 入力を渡す = n => i === 0 && S.input.name.trim() && !n.deps.length;
    const 入力行 = n => 入力を渡す(n)
      ? `\n\n${lit(S.input.name)}: \${typeof 入力 === "string" ? 入力 : JSON.stringify(入力)}` : "";
    const ctxOf = n => {
      const parts = depsOf(n).map(d => "${JSON.stringify(" + d + ")}");
      if (外を見る(n)) parts.push("${JSON.stringify(前の図面)}");
      return 入力行(n)
        + (parts.length ? `\n\n前段の結果:\n` + parts.join("\n") : "")
        + 前の周(n);
    };

    /* この段より後ろで、少なくとも何体は立つか。手前の段に食わせない枠。
       並列は対象の数だけ確定して立つ。検証は上流次第だが、最低1体は立つ。
       繰り返しは最低1周として数える（多めに予約すると手前を削りすぎる）。 */
    const 後で要る = n => seg.filter(x => rk[x.id] > rk[n.id]).reduce((a, x) =>
      a + (x.kind === "gate" || x.kind === "reduce" ? 0
        : x.kind === "fanout" ? Math.max(1, x.items.filter(Boolean).length)
        : 1), 0);

    // エージェントを立てるノードを、await できる式1つにする
    const exprOf = n => {
      const v = "r_" + n.id;
      const 予約 = 後で要る(n);
      if (n.kind === "fanout") {
        const 複数指示 = n.multi
          ? "\\n\\n見つかったものは1件ずつ items に入れて、まとめて返します。"
            + "1件しか返さないと、この段の材料はそれだけになります。"
            + "\\n無理に数を作らず、確かなものだけを入れます。"
          : "";
        return [
          `parallel(枠内に収める(${v}_items, ${jstr(n.title || "並列")}, ${予約}).map((対象) => () =>`,
          `    spawn(\`${promptOf(n)}${複数指示}\n\n対象: \${対象}${ctxOf(n)}\`, {`,
          `      label: \`\${対象}\`,`,
          `      phase: ${jstr(KIND[n.kind].phase)},`,
          ...(分離が要る(n) ? [`      isolation: "worktree",   // この段は同時に走るので、別の作業コピーで動かす`] : []),
          ...書けなくする(n),
          `      schema: ${JSON.stringify(schemaOf(n))},`,
          `    })`,
          `  )).then(a => a.filter(Boolean))`,
        ].join("\n");
      }
      if (n.kind === "verify") {
        const t = S.nodes.find(x => x.id === n.target);
        const tv = t ? "r_" + t.id : "[]";
        /* 基準は、この図面の中で既に走り終えたものだけ渡せる。
           ゲートをまたいだ相手はここに居ないので、静かに落とさず点検側で止める。 */
        const 基準 = (n.basis || []).filter(b => done.has(b)).map(b => {
          const bn = S.nodes.find(x => x.id === b);
          return `【${lit((bn && bn.title) || b)} の出力】\n\${JSON.stringify(r_${b})}`;
        });
        return [
          `parallel(枠内に収める([${tv}].flat().filter(Boolean), ${jstr(n.title || "検証")}, ${予約}).map((item, i) => () =>`,
          `    spawn(\`${verifyPrompt(n, t, 基準)}\`, {`,
          `      label: \`検証:\${i + 1}\`,`,
          `      phase: "検証",`,
          `      agentType: "graphflow:no-write",   // 検証者は直さない。道具ごと持たせない`,
          `      schema: { type: "object", required: ["verdict", "reason"], properties: {`,
          `        verdict: { type: "string", enum: ["KEEP", "DROP", "UNVERIFIED"] },`,
          `        reason: { type: "string" },`,
          `        needed: { type: "string" } } },`,
          `    }).then(v => ({ item, ...(v || {`,
          `      // 公式仕様: agent() は中断・回復不能なAPIエラーのとき null を返す。`,
          `      // ここで落とすと、検証されなかった項目が KEEP でも DROP でもなく静かに消える。`,
          `      verdict: "UNVERIFIED",`,
          `      reason: "検証者が結果を返しませんでした（中断または回復不能なAPIエラー）",`,
          `      needed: "この項目の再検証" }) }))`,
          `  ))`,
        ].join("\n");
      }
      let viaVerify = false;
      const kept = depsOf(n).map(d => {
        const dn = S.nodes.find(x => "r_" + x.id === d);
        if (dn && dn.kind === "verify") { viaVerify = true; return d + "_kept"; }
        return d;
      });
      // 検証を通っていない材料を「検証を通ったものだけ」と書かない
      const 材料 = kept.map(d => "${JSON.stringify(" + d + ")}");
      if (外を見る(n)) 材料.push("${JSON.stringify(前の図面)}");
      const ctx2 = 入力行(n) + (材料.length
        ? `\n\n${viaVerify ? "使ってよい材料（検証を通ったものだけ）" : "前段の結果"}:\n`
          + 材料.join("\n")
        : "") + 前の周(n);
      return [
        `spawn(\`${promptOf(n)}${ctx2}\`, {`,
        `    label: ${jstr(n.title || KIND[n.kind].ja)},`,
        `    phase: ${jstr(KIND[n.kind].phase)},`,
        ...(分離が要る(n) ? [`    isolation: "worktree",   // この段は同時に走るので、別の作業コピーで動かす`] : []),
        ...書けなくする(n).map(s => s.replace(/^ {6}/, "    ")),
        `    schema: ${JSON.stringify(schemaOf(n))},`,
        `  })`,
      ].join("\n");
    };

    // 走らせたあとに要る後処理（進捗ログ・検証の絞り込み）
    const postOf = n => {
      const v = "r_" + n.id;
      if (n.kind === "fanout") {
        const 数え方 = n.multi ? "体" : "件";
        const L2 = [
          // 体数は均す前に取る。均したあとは件数になるので、欠損を数えられなくなる。
          `const ${v}_体数 = ${v}.length`,
          `log(\`${n.title || "並列"}: \${${v}_体数}/\${${v}_items.length} ${数え方}が返りました\`)`,
          `// 上限で切り捨てた分は 枠内に収める() が別に出す。ここは「投げたのに返らなかった」だけを見る。`,
          `if (${v}_体数 < Math.min(${v}_items.length, CAP)) log(\`⚠ ${n.title || "並列"}: \${Math.min(${v}_items.length, CAP) - ${v}_体数}${数え方}が返っていません。この段の結果は欠けています。\`)`,
        ];
        if (n.multi) {
          L2.push(`// 1体が複数件返す契約なので、ここで件の並びに均す。以降は件数で数える。`);
          L2.push(`${v} = ${v}.flatMap(r => Array.isArray(r && r.items) ? r.items : [])`);
          L2.push(`log(\`${n.title || "並列"}: 合わせて \${${v}.length}件\`)`);
          // 体は返ったのに中身が空、は「返らなかった」と同じくらい静かに欠ける。
          L2.push(`if (${v}_体数 > 0 && ${v}.length === 0) log("⚠ ${n.title || "並列"}: 体は返りましたが中身が1件もありません。この段の結果は空です。")`);
        }
        return L2;
      }
      if (n.kind === "verify")
        return [
          `const ${v}_kept = ${v}.filter(x => x.verdict === "KEEP")`,
          `log(\`検証: KEEP \${${v}_kept.length} / DROP \${${v}.filter(x=>x.verdict==="DROP").length} / UNVERIFIED \${${v}.filter(x=>x.verdict==="UNVERIFIED").length}\`)`,
          `if (${v}.some(x => x.verdict === "UNVERIFIED")) log(\`⚠ \${${v}.filter(x=>x.verdict==="UNVERIFIED").length}件は検証できていません。通ったものとして扱わないでください。\`)`,
        ];
      // 単発・統合も agent() なので null で返りうる。黙って次の段に渡さない。
      return [`if (!${v}) log(${jstr("⚠ 「" + (n.title || KIND[n.kind].ja) + "」が結果を返しませんでした（中断または回復不能なAPIエラー）。この先は、この結果なしで進みます。")})`];
    };

    /* 繰り返しの帯。実行中に人の入力は挟めないので、帯は1枚の図面に収まっている
       （またぐ設計は点検が K-28 で止める）。 */
    const LR = loopRange();
    const inThisSeg = LR && seg.some(n => n.id === LR.from.id);
    const looped = n => inThisSeg && rk[n.id] >= LR.a && rk[n.id] <= LR.b;
    /* 「1体が複数件返す」段は、返ってきた体の配列を後で件の配列に均す。
       同じ名前を作り替えるので const では受けられない。 */
    const asg = n => looped(n) ? `r_${n.id} = `
      : (n.kind === "fanout" && n.multi ? `let r_${n.id} = ` : `const r_${n.id} = `);

    /* 🔴 繰り返しは「前の周の結果を、また直す」もの。
       先頭のノードが毎周おなじ入力を読んでいたら、直したものが毎回捨てられ、
       同じ作業を繰り返すだけになる（止まりはするが意味がない）。
       帯の中で最後に成果物を作るノード（検証・整理は除く）の結果を、
       2周目以降だけ先頭に渡す。 */
    const 帯の成果物 = inThisSeg
      ? (seg.filter(looped).filter(x => x.kind !== "verify" && x.kind !== "reduce" && x.kind !== "gate").slice(-1)[0] || null)
      : null;
    const 前の周 = n => (inThisSeg && rk[n.id] === LR.a && 帯の成果物 && 帯の成果物.id !== n.id)
      ? "${周 > 1 ? `\\n\\n前の周でここまで直したもの（今回はこれを対象にします）:\\n"
        + "${JSON.stringify(r_" + 帯の成果物.id + ")}` : \"\"}"
      : "";

    for (const k of Object.keys(groups).map(Number).sort((a, b) => a - b)) {
      const g = groups[k];

      if (inThisSeg && k === LR.a) {
        const body = seg.filter(looped);
        L.push("// 繰り返しの中で作り直す値は、外に出しておく");
        body.forEach(n => {
          L.push(`let r_${n.id}`);
          if (n.kind === "verify") L.push(`let r_${n.id}_kept`);
        });
        // 対象リストは毎周同じなので外に出す
        body.filter(n => n.kind === "fanout").forEach(n =>
          L.push(`const r_${n.id}_items = ${JSON.stringify(n.items.filter(Boolean), null, 2)}`));
        L.push("");
        L.push(`const 最大周回 = ${S.loop.max}`);
        L.push(`const 空回りで終了 = ${S.loop.dry}`);
        L.push("let 周 = 0, 空回り = 0, 未確認の残り = 0");
        L.push("const 既知の指摘 = new Set()");
        L.push("");
        L.push(`// ┌─ 繰り返す（${LR.a + 1}段目〜${LR.b + 1}段目）`);
        L.push("//    合格するまで。止まらないので、周回数と空回りの両方で必ず抜ける。");
        L.push("while (周 < 最大周回 && 空回り < 空回りで終了) {");
        L.push("周++");
        L.push("log(`繰り返し ${周}周目（最大 ${最大周回}）`)");
        L.push("");
      }
      // 整理はコードなので先に置く（エージェントを立てず、同じ段の誰も待たない）
      for (const n of g.filter(x => x.kind === "reduce")) {
        const v = "r_" + n.id;
        const dep = depsOf(n);
        const src = dep[0] || "[]";
        L.push(`// 整理はLLMを呼びません。重複削除と件数確認は素のコードの方が安く速く確実です。`);
        L.push(`const ${v}_in = [${dep.join(", ")}].flat().filter(Boolean)`);
        L.push(`const ${v}_seen = new Set()`);
        if (n.dropEmpty) L.push(`const ${v}_欠け = []`);
        L.push(`${asg(n)}${v}_in.filter(x => {`);
        if (n.dropEmpty) {
          // 🔴 契約に項目があっても、中身が空の文字列なら素通りする。
          //    「出典を付ける」と決めた段で、空の出典が下流へ流れるのがこの穴。
          L.push("  // 中身の空いた項目が1つでもある行は、契約を満たしていないので落とす");
          L.push("  if (x && typeof x === \"object\" && Object.values(x).some(v =>");
          L.push("        v == null || (typeof v === \"string\" && v.trim() === \"\"))) {");
          L.push(`    ${v}_欠け.push(x); return false`);
          L.push("  }");
        }
        L.push("  const k = JSON.stringify(x)");
        L.push(`  if (${v}_seen.has(k)) return false`);
        L.push(`  ${v}_seen.add(k); return true`);
        L.push("})");
        if (n.dropEmpty)
          L.push(`if (${v}_欠け.length) log(\`整理: 中身の欠けた \${${v}_欠け.length}件を落としました\`)`);
        if (n.countCheck) {
          // 「重複で減った」と「返ってこなかった」は別物。欠損だけを INCOMPLETE にする。
          // 並列は投入数、単発は1本として数える。数え落とすと欠損に気づけない。
          const srcs = n.deps
            .map(d => S.nodes.find(x => x.id === d))
            .filter(dn => dn && dn.kind !== "reduce" && dn.kind !== "gate");
          const exp = srcs.map(dn => dn.kind === "fanout" ? `r_${dn.id}_items.length` : "1");
          // 🔴 数えるのは「投げた仕事が返ったか」。1体が複数件返す段では
          //    均したあとの件数と体数がずれるので、体数の側で突き合わせる。
          const got = srcs.map(dn => dn.kind === "fanout"
            ? (dn.multi ? `r_${dn.id}_体数` : `r_${dn.id}.length`)
            : `(r_${dn.id} ? 1 : 0)`);
          L.push(`// 静かに失敗した1件を完成扱いにしないための件数確認`);
          if (srcs.length) {
            L.push(`const ${v}_expected = ${exp.join(" + ")}`);
            L.push(`const ${v}_returned = ${got.join(" + ")}`);
          } else {
            L.push(`const ${v}_expected = ${v}_in.length`);
            L.push(`const ${v}_returned = ${v}_in.length`);
          }
          L.push(`const ${v}_missing = ${v}_expected - ${v}_returned`);
          L.push(`const ${v}_status = ${v}_missing === 0 ? "OK" : "INCOMPLETE"`);
          L.push(`log(\`整理: 予定 \${${v}_expected} / 実際 \${${v}_returned}\``);
          L.push(`  + \` / 欠損 \${${v}_missing} / 状態 \${${v}_status} — 重複を除いて \${${v}.length}件\`)`);
          L.push(`if (${v}_status === "INCOMPLETE") log("⚠ 返らなかった仕事があります。この結果を完成として扱わないでください。")`);
        }
        void src;
        L.push("");
        done.add(n.id);
      }

      const agents = g.filter(x => x.kind !== "reduce");
      if (!agents.length) continue;

      L.push(`phase(${jstr(KIND[agents[0].kind].phase)})`);
      for (const n of agents.filter(x => x.kind === "fanout"))
        if (!looped(n)) L.push(`const r_${n.id}_items = ${JSON.stringify(n.items.filter(Boolean), null, 2)}`);
      if (agents.some(x => x.kind === "verify"))
        L.push("// 検証者には作業者の会話履歴を渡しません。完成物と基準だけを渡します。");

      if (agents.length === 1) {
        L.push(`${asg(agents[0])}await ${exprOf(agents[0])}`);
      } else {
        L.push(`// この段の ${agents.length} 本は互いに依存していないので、まとめて同時に走らせます。`);
        const tmp = `_段${k}`;
        L.push(`const ${tmp} = await parallel([`);
        agents.forEach(n => L.push(`  () => ${exprOf(n)},`));
        L.push("])");
        agents.forEach((n, i) => L.push(`${asg(n)}${tmp}[${i}]`));
      }
      agents.forEach(n => {
        postOf(n).forEach(x => L.push(looped(n) && /^const (r_\w+_kept)/.test(x)
          ? x.replace(/^const /, "") : x));
        done.add(n.id);
      });
      L.push("");

      if (inThisSeg && k === LR.b) {
        const j = loopJudge();
        const jv = j ? "r_" + j.id : null;
        if (jv) {
          L.push("// 合否。まだ落ちているもののうち、前の周に無かったものだけを「新しい指摘」と数える。");
          L.push(`const 未合格 = ${jv}.filter(v => v.verdict === "DROP")`);
          L.push("const 印 = v => JSON.stringify(v.item ?? v.reason ?? v)");
          L.push("const 新しい指摘 = 未合格.filter(v => !既知の指摘.has(印(v)))");
          L.push("新しい指摘.forEach(v => 既知の指摘.add(印(v)))");
          L.push("if (新しい指摘.length === 0) 空回り++; else 空回り = 0");
          L.push("// 検証できなかったものは「通った」ではない。合格の判定に混ぜない。");
          L.push(`未確認の残り = ${jv}.filter(v => v.verdict === "UNVERIFIED").length`);
          L.push("log(`${周}周目: 未合格 ${未合格.length}件 / 未確認 ${未確認の残り}件"
            + " / 新しい指摘 ${新しい指摘.length}件`"
            + " + ` / 空回り ${空回り}/${空回りで終了}`)");
          L.push("if (未合格.length === 0 && 未確認の残り === 0) { log(`${周}周目で全部通りました`); break }");
        }
        L.push("}");
        L.push("// └─ 繰り返し ここまで");
        L.push("if (周 >= 最大周回) log(`⚠ ${最大周回}周まで回しましたが終わっていません。残りは人が見てください。`)");
        if (jv) L.push("if (未確認の残り > 0) log(`⚠ ${未確認の残り}件は検証できないまま終わりました。通ったものとして扱わないでください。`)");
        L.push("");
      }
    }

    if (seg.gate) {
      L.push("// ── 人間ゲート ──────────────────────────────");
      L.push(`// ${seg.gate.title || "承認"}`);
      if (seg.gate.job.trim()) seg.gate.job.trim().split("\n").forEach(x => L.push("// " + x));
      L.push("// 実行中に人間の入力は挟めません。ここで一度止め、");
      L.push(`// 承認できたら /${S.name}-${i + 2} を人が起動します。`);
      L.push("");
    }

    const last = seg[seg.length - 1];
    if (last) {
      // 最後の段が null で返ったまま「結果」として返さない
      const 複数 = last.kind === "fanout" || last.kind === "verify" || last.kind === "reduce";
      L.push("const 完成 = " + (複数 ? `r_${last.id}.length > 0` : `!!r_${last.id}`));
      L.push('if (!完成) log("⚠ 最後の段が結果を返していません。この戻り値を完成物として扱わないでください。")');
      L.push(`return { result: r_${last.id}, status: 完成 ? "OK" : "INCOMPLETE", cap: CAP }`);
    } else {
      L.push("return { result: null, status: \"INCOMPLETE\", cap: CAP }   // この図面には仕事がありません");
    }
    return { file: nm + ".js", code: L.join("\n") };
  });
}

/* ══ 書き出し ══════════════════════════════════════════ */
let tabs = [], cur = 0;
function issue() {
  const gen = generate();
  tabs = [...gen, { file: S.name + ".graphflow.json", code: JSON.stringify(S, null, 2) }];
  cur = 0; drawDialog(); $("#dlg").showModal();
}
/* 開いたままの書き出しは、図面が変われば嘘になる。
   ⌘Z で図面が戻ったのに古いコードのまま「保存しました」と言うのが一番たちが悪い。 */
function refreshDialog() {
  const d = $("#dlg");
  if (!d.open) return;
  const 効かない = ["#dlg-save", "#dlg-copy", "#dlg-dl"];
  const block = findings.filter(f => !f.warn).length;
  if (block || !S.nodes.length) {
    効かない.forEach(s => $(s).disabled = true);
    $("#dlg-msg").textContent =
      `図面が変わって、いまは書き出せない状態です（点検 ${block}件）。閉じて図面を直してください。`;
    return;
  }
  const 前 = tabs[cur] && tabs[cur].file;
  tabs = [...generate(), { file: S.name + ".graphflow.json", code: JSON.stringify(S, null, 2) }];
  const i = tabs.findIndex(x => x.file === 前);
  cur = i >= 0 ? i : 0;
  drawDialog();
  効かない.forEach(s => $(s).disabled = false);
  $("#dlg-msg").textContent = "図面が変わったので、書き出す中身を作り直しました";
}

function drawDialog() {
  const t = $("#dlg-tabs"); t.textContent = "";
  tabs.forEach((x, i) => {
    const b = el("button", "tab" + (i === cur ? " on" : ""), x.file);
    b.setAttribute("aria-pressed", i === cur ? "true" : "false");
    // 押したタブにフォーカスを残す。でないとタブを見るたび先頭から押し直しになる
    b.onclick = () => { cur = i; drawDialog(); $("#dlg-tabs").children[i]?.focus(); };
    t.appendChild(b);
  });
  $("#dlg-pre").textContent = tabs[cur].code;
  $("#dlg-msg").textContent = "";
  const split = tabs.length > 2 ? `人間ゲートで ${tabs.length - 1} 枚に割れています。` : "";
  const 呼び方 = S.input.name.trim()
    ? `こう打って起動します:  /${S.name}${tabs.length > 2 ? "-1" : ""} `
      + (S.input.sample.trim() || `ここに${S.input.name}を書く`)
    : (window.__GRAPHFLOW_LOCAL__ ? "" : ".js を .claude/workflows/ に置くと /図面名 で起動できます");
  $("#dlg-path").textContent = split + 呼び方;
  $("#dlg-save").hidden = !window.__GRAPHFLOW_LOCAL__;
}

  "競合調査": () => Object.assign(

    // 上限は実測から。1体が約9件返したので 5体×10件＋検証50＋整理0＋統合1 に耐える数にする
    ["公式サイトの料金ページ（一次情報）", "実際に問い合わせて得た回答"], { max: 64, conc: 5 }, [

        ["競合サービスと料金", "法人担当者の悩み", "利用者の不満", "2026年のトレンド", "差別化の余地"],

        "公式情報を確認できない場合は、推測せず status を unverified にする", null, { multi: true, each: 10 }],
      ["reduce", "重複と同一ソースを畳む", "", null, [["kept", "number"]], "", null, { dropEmpty: true }],
      ["verify", "出典が実在するか確かめる", "", null, [["verdict", "string"]], "確認できないものは unverified にする", "出典の実在と鮮度", { vkind: "fact" }],
      ["synthesize", "調査報告書にまとめる", "検証を通った情報だけを使い、市場機会・顧客課題・競合の弱点・推奨商品・販売戦略をまとめます。",
        null, [["report", "string"], ["opportunities", "array"]], "材料が足りない項目は「材料不足」と明記する"],
    ]),
    { input: {

    s.input = {

  "営業提案": () => Object.assign(

    ["顧客が実際に発言・提供した情報", "公開されている一次情報"], { max: 36, conc: 5 }, [
      ["fanout", "顧客まわりを調べる", "渡された顧客企業を、指定された観点で調べます。顧客が実際に提供した情報と、こちらが推測した情報を必ず分けて書きます。",
        ["事業内容と直近の動き", "業界の課題", "競合の動向", "顧客の過去の発言", "導入の障壁"],
        [["finding", "string"], ["is_from_customer", "boolean"], ["source_url", "string"]],
        "出典を確認できない場合は is_from_customer を false にし status を unverified にする", null, { multi: true, each: 5 }],
      ["reduce", "重複を畳む", "", null, [["kept", "number"]], "", null, { dropEmpty: true }],
      ["verify", "推測が事実として書かれていないか見る", "", null, [["verdict", "string"]], "判断できないものは unverified にする", "推測と事実の混同", { vkind: "fact" }],
      ["synthesize", "提案書と想定問答を作る", "検証を通った材料だけで、提案・見積の前提・商談質問・反論対応を作ります。推測に基づく箇所には印を付けます。",
        null, [["proposal", "string"], ["questions", "array"]], "顧客未確認の前提は必ず「未確認」と明記する"],

/* 依存を添字で明示する版。分岐や合流があるひな形はこちらで書く。 */
function buildGraph(name, goal, anchors, caps, rows) {
  seq = 0;
  const s = blank();
  s.name = name; s.goal = goal; s.anchors = anchors; s.caps = caps;
  const made = [];
  for (const r of rows) {
    const prev = S; S = s;               // newNode が末端を見るので一時的に差し替える
    const n = newNode(r.k);
    S = prev;
    n.title = r.t; n.job = r.j || "";
    n.deps = (r.d || []).map(i => made[i].id);
    n.edgeChecked = true;
    n.fileChecked = true;
    n.writesFiles = !!r.writes;
    if (r.items) n.items = r.items;
    if (r.o) n.outputs = r.o.map(([nm, ty]) => ({ name: nm, type: ty }));
    if (r.f) n.fail = r.f;
    n.multi = !!r.multi;
    if (r.each) n.each = r.each;
    n.dropEmpty = !!r.dropEmpty;
    if (r.k === "verify") {
      n.target = made[r.d[0]].id; n.lens = r.lens || ""; n.vkind = r.vkind || "fact";
      n.basis = (r.basis || []).map(i => made[i].id);
      n.basis.forEach(b => { if (!n.deps.includes(b)) n.deps.push(b); });
    }
    s.nodes.push(n); made.push(n);
  }
  return s;
}

function build(name, goal, anchors, caps, rows) {
  seq = 0;
  const s = blank();
  s.name = name; s.goal = goal; s.anchors = anchors; s.caps = caps;
  let prev = null;
  for (const [kind, title, job, items, outs, fail, lens, opts] of rows) {
    const o = opts || {};
    const n = newNode(kind);
    n.title = title; n.job = job || ""; n.deps = prev ? [prev.id] : [];
    n.edgeChecked = true;
    n.fileChecked = true;
    if (items) n.items = items;
    if (outs) n.outputs = outs.map(([nm, ty]) => ({ name: nm, type: ty }));
    if (fail) n.fail = fail;
    n.multi = !!o.multi;
    if (o.each) n.each = o.each;
    n.dropEmpty = !!o.dropEmpty;
    if (kind === "verify") { n.target = prev ? prev.id : ""; n.lens = lens || ""; n.vkind = o.vkind || "fact"; }
    if (kind === "gate") n.irreversible = false;
    s.nodes.push(n); prev = n;
  }
  return s;
}

/* ══ 配線 ══════════════════════════════════════════════ */
function 部品を置く(kind) {
  // 起動時の入力は部品ではなく図面に1つだけ。置き場所は部品箱に揃える。
  if (kind === "input") {
    /* 🔴 以前はここで新品に差し替えていたので、書いてあった説明と例が黙って消えた。
       名前が空なら名前だけ入れる。書いたものには触らない。 */
    if (!S.input.name.trim()) S.input = { ...S.input, name: "入力" };
    sel = "__input__"; render();
    document.querySelector(".col.right").scrollTop = 0;
    図面に映す("__input__");
    return;
  }
  if (!KIND[kind]) return;
  const n = newNode(kind);
  S.nodes.push(n); sel = n.id; render();
  document.querySelector(".col.right").scrollTop = 0;
  図面に映す(n.id);          // 置いた部品が枠の外だと、置けたことが分からない
}

/* 押しても置けるし、図面へドラッグしても置ける。
   ドラッグできそうな見た目なのに掴めないのが一番たちが悪いので、両方に応える。 */
const DND = "text/graphflow-part";
document.querySelectorAll(".part").forEach(b => {
  b.onclick = () => 部品を置く(b.dataset.k);
  b.draggable = true;
  b.addEventListener("dragstart", e => {
    e.dataTransfer.effectAllowed = "copy";
    e.dataTransfer.setData(DND, b.dataset.k);
    e.dataTransfer.setData("text/plain", b.dataset.k);
  });
});
{
  const wrap = document.querySelector(".canvas-wrap");
  const 部品か = e => [...(e.dataTransfer ? e.dataTransfer.types : [])].includes(DND);
  wrap.addEventListener("dragover", e => {
    if (!部品か(e)) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "copy";
    wrap.classList.add("drop-here");
  });
  wrap.addEventListener("dragleave", e => { if (e.target === wrap) wrap.classList.remove("drop-here"); });
  wrap.addEventListener("drop", e => {
    if (!部品か(e)) return;
    e.preventDefault(); wrap.classList.remove("drop-here");
    部品を置く(e.dataTransfer.getData(DND));
  });
}
$("#f-name").oninput = e => { S.name = e.target.value.trim(); scheduleRender(); };
$("#f-goal").oninput = e => { S.goal = e.target.value; scheduleRender(); };
$("#f-cap").oninput = e => { S.caps.max = +e.target.value || 0; scheduleRender(); };
$("#f-conc").oninput = e => { S.caps.conc = +e.target.value || 0; scheduleRender(); };
$("#btn-anchor").onclick = () => { S.anchors.push(""); render(); };
$("#btn-issue").onclick = issue;
$("#dlg-x").onclick = () => $("#dlg").close();

const selT = $("#sel-tmpl");
Object.keys(TEMPLATES).forEach(k => {
  const o = el("option", null, k); o.value = k; selT.appendChild(o);
});
/* 🔴 「ノードがあるか」で聞くと、ひな形を読んだ直後にも必ず聞かれる。
   まだ1文字も直していないのに「消えます」と言われるので、ひな形の見比べができない。
   読んだ直後の姿を覚えておき、そこから変わっていなければ手つかずとみなす。 */
/* 🔴 「ノードがあるか」で見てはいけない。部品を置く前に図面名・目的・アンカーだけ
   書いた状態は、本人にとっては立派な描きかけなのに、無警告で消えていた。
   読んだ直後の姿と1文字でも違えば描きかけとみなす。 */
let 手つかずの姿 = JSON.stringify(blank());
const 描きかけ = () => JSON.stringify(S) !== 手つかずの姿;
const 読み込んだ = () => { 手つかずの姿 = JSON.stringify(S); };

/* 🔴 描いた図面はどこにも残らない。再読み込み・タブを閉じるで丸ごと消える。
   保存していないものがあるときだけ、閉じる前に一度止める。 */
window.addEventListener("beforeunload", e => {
  if (!描きかけ()) return;
  e.preventDefault();
  e.returnValue = "";
});

/* 🔴 confirm() と alert() は使わない。
   サンドボックス（Artifact の iframe など）では黙って false が返るので、
   「ダイアログも出ないのに、何も起きない」という一番たちの悪い状態になる。
   ⇒ 確認は <dialog> で自前に出す。これはただのHTML要素なので、どこでも出る。 */
function 確かめる(本文, 補足, はいの文字) {
  return new Promise(res => {
    const d = $("#ask");
    $("#ask-msg").textContent = 本文;
    $("#ask-sub").textContent = 補足 || "";
    $("#ask-yes").textContent = はいの文字 || "読み込む";
    let 済 = false;
    const 閉じる = v => { if (済) return; 済 = true; d.close(); res(v); };
    $("#ask-yes").onclick = () => 閉じる(true);
    $("#ask-no").onclick = () => 閉じる(false);
    d.oncancel = () => 閉じる(false);      // Esc
    d.onclose = () => 閉じる(false);       // どの経路で閉じても宙づりにしない
    d.showModal();
    $("#ask-no").focus();                  // 既定は「やめる」＝取り返しのつく側
  });
}
let toastT = null;
function 知らせる(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.hidden = true; }, 5000);
}
// 図面の検査や書き出しはブラウザの外からも走らせるので、navigator が無い前提で書く
const 戻すキー = (typeof navigator !== "undefined" && /Mac|iPhone|iPad/.test(navigator.userAgent))
  ? "⌘Z" : "Ctrl+Z";

selT.onchange = async () => {
  const k = selT.value;
  selT.value = "";
  if (!k || !TEMPLATES[k]) return;
  const 捨てる = 描きかけ();
  // 手を付けた図面を捨てるときだけ聞く。手つかずなら黙って差し替える（見比べのため）
  if (捨てる && !await 確かめる(
    `いま描いている図面「${S.name || "無題"}」は消えます。ひな形「${k}」を読み込みますか？`,
    `読み込んだ後でも ${戻すキー} で1回だけ戻せます。`)) return;
  if (捨てる) snapshot();          // 描きかけを捨てる前に、1手ぶん控えておく
  S = TEMPLATES[k](); sel = null; 読み込んだ(); render();
  知らせる(捨てる ? `ひな形を読み込みました（前の図面に戻すなら ${戻すキー}）` : "ひな形を読み込みました");
};

$("#btn-load").onclick = () => {
  const inp = el("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    // ひな形と同じく、手を付けた図面を捨てるときだけ聞く
    const 捨てる = 描きかけ();
    if (捨てる && !await 確かめる(
      `いま描いている図面「${S.name || "無題"}」は消えます。読み込みますか？`,
      `読み込んだ後でも ${戻すキー} で1回だけ戻せます。`)) return;
    /* 🔴 読み込みに失敗したときに控えを差し替えたままにすると、
       直前の削除を戻す1手ぶんが、何も変わっていないのに消える。 */
    const 元の控え = undoSnap;
    if (捨てる) snapshot();
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.nodes)) throw new Error("nodes がありません");
        S = normalize(d); seq = S.nodes.length;
        S.nodes.forEach(n => { const m = /^n(\d+)$/.exec(n.id); if (m) seq = Math.max(seq, +m[1]); });
        sel = null; 読み込んだ(); render();
        // 読めなかった部品があったなら、成功の顔をしない
        const 欠け = 読み落とし ? `。⚠ 読めない部品 ${読み落とし}件を外しました（その部品に入っていた線も一緒に消えています）` : "";
        知らせる((捨てる ? `読み込みました（前の図面に戻すなら ${戻すキー}）` : "読み込みました") + 欠け);
      } catch (e) {
        undoSnap = 元の控え;      // 図面は何も変わっていない。控えも元に戻す
        /* 生の英語例外文を出しても打つ手が分からない。何を選べばいいかまで書く。 */
        知らせる("このファイルは GraphFlow の図面ではありません。"
          + "書き出しで作った .graphflow.json を選んでください"
          + `（読めなかった理由: ${e.message}）`);
      }
    };
    r.readAsText(f);
  };
  inp.click();
};

$("#dlg-copy").onclick = async () => {
  try { await navigator.clipboard.writeText(tabs[cur].code); $("#dlg-msg").textContent = "コピーしました"; }
  catch { $("#dlg-msg").textContent = "コピーできませんでした。手で選択してください"; }
};
$("#dlg-dl").onclick = () => {
  const b = new Blob([tabs[cur].code], { type: "text/plain" });
  const a = el("a"); a.href = URL.createObjectURL(b); a.download = tabs[cur].file; a.click();
  URL.revokeObjectURL(a.href); $("#dlg-msg").textContent = "ダウンロードしました";
};
/* 保存先に同じ名前のファイルがあるか、書く前に聞く。
   ここで聞かないと、手で書いたファイルが無確認で潰れて、事後報告だけが残る。 */
async function 既にあるファイル(names) {
  try {
    const r = await fetch("/write", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ probe: true, files: names.map(n => ({ name: n, code: "" })) }),
    });
    const t = await r.text();
    const j = t ? JSON.parse(t) : null;
    return r.ok && j && Array.isArray(j.exists) ? j.exists : [];
  } catch { return []; }
}

$("#dlg-save").onclick = async () => {
  const 既存 = await 既にあるファイル(tabs.map(t => t.file));
  if (既存.length && !await 確かめる(
    `${既存.join("、")} は既にあります。上書きしますか？`,
    "上書きすると、いまその中に書かれている内容は戻せません。", "上書きする")) {
    $("#dlg-msg").textContent = "保存をやめました（ファイルはそのままです）";
    return;
  }
  $("#dlg-msg").textContent = "保存中…";
  let res;
  try {
    res = await fetch("/write", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ files: tabs.map(t => ({ name: t.file, code: t.code })) }),
    });
  } catch {
    /* サーバーが止まっている / 通信できない。ここで英語の例外文を出しても
       打つ手が分からないので、逃げ道（ダウンロード）まで書く。 */
    $("#dlg-msg").textContent =
      "保存できませんでした。graphflow のサーバーが止まっているようです。"
      + "ターミナルで graphflow を起動し直してから、もう一度押してください。"
      + "急ぐときは「ダウンロード」で手元に落とせます（図面は消えていません）";
    return;
  }
  /* 本文がJSONとは限らない（403・404 は空で返る）。先に文字列で受けて、
     読めたときだけ中身を使う。ここで例外を出すと理由が消える。 */
  const text = await res.text().catch(() => "");
  let j = null;
  try { j = text ? JSON.parse(text) : null; } catch { j = null; }
  if (!res.ok || !j || !Array.isArray(j.written)) {
    $("#dlg-msg").textContent = "保存できませんでした: "
      + ((j && j.error) || `サーバーが ${res.status} を返しました`)
      + "。「ダウンロード」で手元に落とせます";
    return;
  }
  const ow = (j.overwritten || []).length;
  /* 🔴 図面名をそのまま案内していたので、ゲートで割れた図面では
     実在しないコマンド（/article-build）を教えていた。実際に置いたファイルから作る。 */
  const 一枚目 = tabs.find(t => /\.js$/.test(t.file));
  const 起動名 = 一枚目 ? 一枚目.file.replace(/\.js$/, "") : S.name;
  $("#dlg-msg").textContent = `${j.written.length}件を保存しました`
    + (ow ? `（うち${ow}件を上書き）` : "") + ` → /${起動名} で起動できます`;
};

/* 図面の余白を押したら選択を外す。「選ぶ」があって「やめる」が無いと、
   ×が出っぱなしのまま別の場所を触ることになる。 */
document.querySelector(".canvas-wrap").addEventListener("click", e => {
  if (!e.target.closest(".node") && !e.target.closest(".in-box") && sel !== null) { sel = null; render(); }
});

/* 1手だけ戻す。削除は取り消せないと押し間違いがそのまま損失になる。 */
document.addEventListener("keydown", e => {
  const t = e.target;
  if ((e.key === "z" || e.key === "Z") && (e.metaKey || e.ctrlKey) && !e.shiftKey) {
    if (t && t.matches && t.matches("input, textarea")) return;   // 文字入力の取り消しは邪魔しない
    if (undo()) e.preventDefault();
  }
  if (e.key === "Escape" && !$("#dlg").open && sel !== null) { sel = null; render(); }
});

/* 明暗。押すたびに必ず見た目が変わり、選んだ側は次に開いても残る。 */
const THEME_KEY = "graphflow.theme";
function applyTheme(t, persist) {
  document.documentElement.setAttribute("data-theme", t);
  const b = $("#btn-theme");
  const label = t === "dark" ? "明るい配色にする" : "暗い配色にする";
  b.textContent = t === "dark" ? "◑" : "◐";
  b.title = label;
  b.setAttribute("aria-label", label);
  b.setAttribute("aria-pressed", t === "dark" ? "true" : "false");
  if (persist) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
}
applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light", false);
$("#btn-theme").onclick = () => {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark", true);
};

/* graphflow コマンドから図面を渡された場合はそれを開く */
if (window.__GRAPHFLOW_PRELOAD__ && Array.isArray(window.__GRAPHFLOW_PRELOAD__.nodes)) {
  S = normalize(window.__GRAPHFLOW_PRELOAD__);
  seq = S.nodes.length;
  S.nodes.forEach(n => { const m = /^n(\d+)$/.exec(n.id); if (m) seq = Math.max(seq, +m[1]); });
}

render();
